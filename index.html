 "w": "pommes is feminine plural: chères.", "h2": "cher, chère, chers, chères.", "hq": "pommes: masculine or feminine? One or several?", "nc": "Le pain est cher ≠ Les pommes sont ___ .", "en": "Apples are expensive today.", "own": "avec « c'est cher » ou « elles sont chères »", "o": ["chères", "chers", "chère", "chèrs"], "a": 0}, {"id": "a5", "f": "accord", "t": "mc", "q": "C'est une ___ idée.", "m": "C'est une bonne idée.", "w": "idée is feminine: bonne. bien is not an adjective here.", "h2": "bon (adjective, with a noun) · bien (with a verb: tu chantes bien).", "hq": "idée: masculine or feminine? Do you need an adjective or an adverb?", "nc": "C'est un bon plan (masculine) ≠ C'est une ___ idée (feminine).", "en": "That's a good idea.", "own": "avec « c'est une bonne idée »", "o": ["bonne", "bon", "bien", "bonnes"], "a": 0}, {"id": "s1", "f": "subj", "t": "mc", "q": "Il faut que tu ___ ce formulaire.", "m": "Il faut que tu remplisses ce formulaire.", "w": "il faut que + subjonctif: que tu remplisses.", "h2": "il faut que + subjonctif · il faut + infinitive.", "hq": "After il faut que, which mood: present, infinitive or subjonctif?", "nc": "Il faut remplir ce formulaire (general) ≠ Il faut que tu ___ ce formulaire (you).", "en": "You have to fill in this form.", "own": "avec « il faut que tu… »", "o": ["remplisses", "remplissais", "rempliras", "remplis"], "a": 0}, {"id": "s2", "f": "subj", "t": "mc", "q": "Il faut que j'___ à la banque.", "m": "Il faut que j'aille à la banque.", "w": "aller in the subjonctif: que j'aille, que tu ailles, qu'il aille.", "h2": "que j'aille · que je fasse · que je sois · que j'aie.", "hq": "il faut que + subjonctif. aller is irregular: que j'a___ ?", "nc": "je vais (present) ≠ que j'___ (subjonctif).", "en": "I have to go to the bank.", "own": "avec « il faut que j'aille… »", "o": ["aille", "vais", "aller", "irai"], "a": 0}, {"id": "s3", "f": "subj", "t": "type", "q": "Il faut que vous ___ patients.", "m": "Il faut que vous soyez patients.", "w": "être in the subjonctif: que vous soyez.", "h2": "que je sois, que tu sois, qu'il soit, que nous soyons, que vous soyez.", "hq": "il faut que + subjonctif of être, with vous.", "nc": "vous êtes (present) ≠ que vous ___ (subjonctif).", "en": "You have to be patient.", "own": "avec « il faut que vous soyez… »", "a": ["soyez"], "h": "être"}, {"id": "s4", "f": "subj", "t": "mc", "q": "Je veux que tu ___ attention.", "m": "Je veux que tu fasses attention.", "w": "vouloir que + subjonctif: que tu fasses (faire).", "h2": "faire attention = to be careful. que je fasse, que tu fasses.", "hq": "After je veux que, which mood? faire is irregular.", "nc": "Je veux faire attention (me) ≠ Je veux que tu ___ attention (you).", "en": "I want you to be careful.", "own": "avec « je veux que tu… »", "o": ["fasses", "faisais", "feras", "fais"], "a": 0}, {"id": "s5", "f": "subj", "t": "order", "q": "", "m": "Il faut que je fasse les courses.", "w": "il faut que + je + subjonctif (fasse) + the rest.", "h2": "il faut que + subjonctif.", "hq": "What comes after il faut? Then the subject, then the verb.", "nc": "Il faut faire les courses ≠ Il faut que je ___ les courses.", "en": "I have to do the shopping.", "own": "avec « il faut que je… »", "a": "Il faut que je fasse les courses."}], "LP": [{"id": "p1", "title": "À la boulangerie", "src": "Dialogue", "lines": [["A", "Bonjour monsieur, qu'est-ce que je vous sers ?"], ["B", "Bonjour. Je voudrais deux baguettes bien cuites et quatre croissants, s'il vous plaît."], ["A", "Désolée, il ne me reste plus de croissants. Je peux vous proposer des pains au chocolat."], ["B", "D'accord, alors trois pains au chocolat. Ça fait combien ?"], ["A", "Deux baguettes, trois pains au chocolat… ça fait six euros quarante."], ["B", "Voilà dix euros."], ["A", "Et voici votre monnaie, trois euros soixante. Bonne journée !"]], "qs": [{"q": "Combien de baguettes le client achète-t-il ?", "o": ["Deux", "Une", "Trois", "Quatre"], "a": 0, "w": "He asks for « deux baguettes bien cuites »."}, {"q": "Pourquoi le client ne prend-il pas de croissants ?", "o": ["Il n'y en a plus", "Ils sont trop chers", "Il préfère le pain", "Ils ne sont pas cuits"], "a": 0, "w": "« il ne me reste plus de croissants » = there are no croissants left."}, {"q": "Combien la vendeuse rend-elle ?", "o": ["3,60 €", "6,40 €", "4,60 €", "3,40 €"], "a": 0, "w": "He pays 10 €, it costs 6,40 €: the change is 3,60 € (trois euros soixante)."}], "ex": ["Je voudrais deux baguettes bien cuites", "il ne me reste plus de croissants", "Et voici votre monnaie, trois euros soixante."], "vocab": [["qu'est-ce que je vous sers", "what can I get you"], ["bien cuites", "well-baked"], ["il ne me reste plus de", "I have no … left"], ["Je peux vous proposer", "I can offer you"], ["Ça fait combien", "How much is it"], ["votre monnaie", "your change"], ["Bonne journée", "Have a nice day"], ["D'accord", "OK"]], "learn": [["Je voudrais deux baguettes, s'il vous plaît.", "I'd like two baguettes, please."], ["Ça fait combien ?", "How much is it?"], ["Il ne reste plus de croissants.", "There are no croissants left."]], "gram": "ne … plus de + noun = no … left: il ne reste plus de croissants (de, not des, after the negative).", "bonus": "Qu'est-ce que le client achète ?", "bonusRef": "Il achète deux baguettes et trois pains au chocolat.", "text": "Bonjour monsieur, qu'est-ce que je vous sers ? Bonjour. Je voudrais deux baguettes bien cuites et quatre croissants, s'il vous plaît. Désolée, il ne me reste plus de croissants. Je peux vous proposer des pains au chocolat. D'accord, alors trois pains au chocolat. Ça fait combien ? Deux baguettes, trois pains au chocolat… ça fait six euros quarante. Voilà dix euros. Et voici votre monnaie, trois euros soixante. Bonne journée !", "audio": "audio/01.mp3"}, {"id": "p2", "title": "Message du cabinet médical", "src": "Répondeur", "lines": [["N", "Bonjour, ici le cabinet du docteur Martin. Ce message est pour monsieur Petrenko. Votre rendez-vous de jeudi à dix heures est annulé, parce que le docteur est malade. Nous vous proposons un nouveau rendez-vous lundi prochain à quatorze heures trente. Si cet horaire ne vous convient pas, rappelez-nous du lundi au vendredi, entre huit heures et midi. Merci et bonne journée."]], "qs": [{"q": "Pourquoi le rendez-vous est-il annulé ?", "o": ["Le docteur est malade", "Le cabinet est fermé", "Le patient est en retard", "Le docteur est en congé"], "a": 0, "w": "« parce que le docteur est malade » = because the doctor is ill."}, {"q": "Quel est le nouveau rendez-vous ?", "o": ["Lundi à 14 h 30", "Jeudi à 10 h", "Lundi à 10 h 30", "Jeudi à 14 h 30"], "a": 0, "w": "« lundi prochain à quatorze heures trente » = next Monday at 2.30 pm."}, {"q": "Quand peut-on rappeler le cabinet ?", "o": ["Le matin, en semaine", "Le soir, en semaine", "Le samedi et le dimanche", "Tous les après-midi"], "a": 0, "w": "« du lundi au vendredi, entre huit heures et midi » = weekday mornings."}], "ex": ["parce que le docteur est malade", "lundi prochain à quatorze heures trente", "du lundi au vendredi, entre huit heures et midi"], "vocab": [["le cabinet", "the doctor's practice"], ["Votre rendez-vous", "your appointment"], ["est annulé", "is cancelled"], ["lundi prochain", "next Monday"], ["ne vous convient pas", "doesn't suit you"], ["rappelez-nous", "call us back"], ["du lundi au vendredi", "from Monday to Friday"], ["entre huit heures et midi", "between 8 am and noon"]], "learn": [["Mon rendez-vous est annulé.", "My appointment is cancelled."], ["Cet horaire ne me convient pas.", "That time doesn't suit me."], ["Je voudrais prendre un nouveau rendez-vous.", "I'd like to make a new appointment."]], "gram": "French uses the 24-hour clock: quatorze heures trente = 2.30 pm. du lundi au vendredi = from Monday to Friday.", "bonus": "Quand est le nouveau rendez-vous ?", "bonusRef": "Le nouveau rendez-vous est lundi prochain à quatorze heures trente.", "text": "Bonjour, ici le cabinet du docteur Martin. Ce message est pour monsieur Petrenko. Votre rendez-vous de jeudi à dix heures est annulé, parce que le docteur est malade. Nous vous proposons un nouveau rendez-vous lundi prochain à quatorze heures trente. Si cet horaire ne vous convient pas, rappelez-nous du lundi au vendredi, entre huit heures et midi. Merci et bonne journée.", "audio": "audio/02.mp3"}, {"id": "p3", "title": "Annonce à la gare", "src": "Annonce", "lines": [["N", "Mesdames et messieurs, votre attention, s'il vous plaît. Le train à destination de Marseille, prévu au départ à neuf heures quinze, partira avec un retard d'environ vingt minutes, en raison d'un problème technique. Attention : il partira voie B, et non voie A. Nous vous prions de nous excuser pour la gêne occasionnée."]], "qs": [{"q": "Où va le train ?", "o": ["À Marseille", "À Montpellier", "À Toulon", "À Avignon"], "a": 0, "w": "« à destination de Marseille » = going to Marseille."}, {"q": "À quelle heure le train va-t-il partir, à peu près ?", "o": ["Vers 9 h 35", "À 9 h 15", "Vers 9 h 20", "Vers 9 h 55"], "a": 0, "w": "Planned at 9.15, about 20 minutes late: around 9.35."}, {"q": "Où les voyageurs doivent-ils aller ?", "o": ["Voie B", "Voie A", "Au guichet", "À la sortie"], "a": 0, "w": "« il partira voie B, et non voie A » = platform B, not A."}], "ex": ["à destination de Marseille", "prévu au départ à neuf heures quinze, partira avec un retard d'environ vingt minutes", "il partira voie B, et non voie A"], "vocab": [["votre attention", "your attention"], ["à destination de", "going to"], ["prévu au départ à", "due to leave at"], ["un retard", "a delay"], ["environ", "about"], ["en raison d'", "because of"], ["voie B", "platform B"], ["la gêne occasionnée", "the inconvenience"]], "learn": [["Le train a vingt minutes de retard.", "The train is twenty minutes late."], ["Le train part de quelle voie ?", "Which platform does the train leave from?"], ["Excusez-moi, ce train va à Marseille ?", "Excuse me, does this train go to Marseille?"]], "gram": "partira = futur simple of partir (partir + a). un retard de vingt minutes = a twenty-minute delay; être en retard = to be late.", "bonus": "Pourquoi le train est-il en retard ?", "bonusRef": "Le train est en retard à cause d'un problème technique.", "text": "Mesdames et messieurs, votre attention, s'il vous plaît. Le train à destination de Marseille, prévu au départ à neuf heures quinze, partira avec un retard d'environ vingt minutes, en raison d'un problème technique. Attention : il partira voie B, et non voie A. Nous vous prions de nous excuser pour la gêne occasionnée.", "audio": "audio/03.mp3"}, {"id": "p4", "title": "À la pharmacie", "src": "Dialogue", "lines": [["A", "Bonjour, je peux vous aider ?"], ["B", "Bonjour. J'ai mal à la gorge depuis deux jours. Vous avez quelque chose ?"], ["A", "Vous avez de la fièvre ?"], ["B", "Non, je n'ai pas de fièvre, mais je tousse un peu la nuit."], ["A", "Alors je vous conseille ces pastilles et ce sirop. Si ça ne va pas mieux dans trois jours, allez voir votre médecin."], ["B", "Merci. Je vous dois combien ?"], ["A", "Huit euros cinquante. Vous payez par carte ?"], ["B", "Oui, par carte."]], "qs": [{"q": "Depuis quand le client a-t-il mal à la gorge ?", "o": ["Depuis deux jours", "Depuis trois jours", "Depuis hier soir", "Depuis une semaine"], "a": 0, "w": "« J'ai mal à la gorge depuis deux jours »."}, {"q": "Quel autre problème a-t-il ?", "o": ["Il tousse la nuit", "Il a de la fièvre", "Il a mal à la tête", "Il a mal au ventre"], "a": 0, "w": "« je n'ai pas de fièvre, mais je tousse un peu la nuit »."}, {"q": "Que faire si ça ne va pas mieux ?", "o": ["Voir le médecin", "Revenir demain", "Acheter un sirop", "Rester au lit"], "a": 0, "w": "« allez voir votre médecin » = go and see your doctor."}], "ex": ["J'ai mal à la gorge depuis deux jours", "je n'ai pas de fièvre, mais je tousse un peu la nuit", "Si ça ne va pas mieux dans trois jours, allez voir votre médecin."], "vocab": [["J'ai mal à la gorge", "I have a sore throat"], ["depuis deux jours", "for two days"], ["de la fièvre", "a temperature"], ["je tousse", "I cough"], ["je vous conseille", "I recommend"], ["ces pastilles", "these lozenges"], ["ça ne va pas mieux", "it doesn't get better"], ["Je vous dois combien", "How much do I owe you"]], "learn": [["J'ai mal à la gorge depuis deux jours.", "I've had a sore throat for two days."], ["Je n'ai pas de fièvre.", "I don't have a temperature."], ["Je vous dois combien ?", "How much do I owe you?"]], "gram": "depuis + present: J'ai mal depuis deux jours = I have had a pain for two days (English: have had; French: present).", "bonus": "Qu'est-ce que la pharmacienne conseille ?", "bonusRef": "Elle conseille des pastilles et un sirop.", "text": "Bonjour, je peux vous aider ? Bonjour. J'ai mal à la gorge depuis deux jours. Vous avez quelque chose ? Vous avez de la fièvre ? Non, je n'ai pas de fièvre, mais je tousse un peu la nuit. Alors je vous conseille ces pastilles et ce sirop. Si ça ne va pas mieux dans trois jours, allez voir votre médecin. Merci. Je vous dois combien ? Huit euros cinquante. Vous payez par carte ? Oui, par carte.", "audio": "audio/04.mp3"}, {"id": "p5", "title": "La météo de demain", "src": "Radio", "lines": [["N", "Voici la météo pour demain dans le Var. Le matin, le ciel sera nuageux et il fera frais, autour de douze degrés. L'après-midi, le soleil reviendra et les températures monteront jusqu'à dix-neuf degrés. Attention au mistral : le vent soufflera fort sur la côte. Pour le week-end, on annonce de la pluie samedi et un beau temps dimanche."]], "qs": [{"q": "Quel temps fera-t-il demain matin ?", "o": ["Nuageux et frais", "Ensoleillé et chaud", "Pluvieux et froid", "Beau et doux"], "a": 0, "w": "« le ciel sera nuageux et il fera frais » = cloudy and cool."}, {"q": "Quelle sera la température la plus haute ?", "o": ["19 degrés", "12 degrés", "18 degrés", "9 degrés"], "a": 0, "w": "« jusqu'à dix-neuf degrés » = up to 19 degrees."}, {"q": "Quel jour faut-il prendre un parapluie ?", "o": ["Samedi", "Dimanche", "Demain matin", "Demain soir"], "a": 0, "w": "« de la pluie samedi » = rain on Saturday."}], "ex": ["Le matin, le ciel sera nuageux et il fera frais", "les températures monteront jusqu'à dix-neuf degrés", "on annonce de la pluie samedi"], "vocab": [["la météo", "the weather forecast"], ["nuageux", "cloudy"], ["il fera frais", "it will be cool"], ["le soleil reviendra", "the sun will come back"], ["monteront jusqu'à", "will rise to"], ["le vent soufflera fort", "the wind will blow hard"], ["de la pluie", "rain"], ["un beau temps", "fine weather"]], "learn": [["Demain, il fera beau.", "Tomorrow the weather will be fine."], ["Il y a du vent aujourd'hui.", "It's windy today."], ["Il va pleuvoir samedi.", "It's going to rain on Saturday."]], "gram": "Weather uses il: il fait beau, il fait froid, il pleut, il y a du vent. Future: il fera (faire), il pleuvra (pleuvoir).", "bonus": "Quel temps fera-t-il dimanche ?", "bonusRef": "Dimanche, il fera beau.", "text": "Voici la météo pour demain dans le Var. Le matin, le ciel sera nuageux et il fera frais, autour de douze degrés. L'après-midi, le soleil reviendra et les températures monteront jusqu'à dix-neuf degrés. Attention au mistral : le vent soufflera fort sur la côte. Pour le week-end, on annonce de la pluie samedi et un beau temps dimanche.", "audio": "audio/05.mp3"}, {"id": "p6", "title": "Au marché", "src": "Dialogue", "lines": [["A", "Bonjour ! Qu'est-ce qu'il vous faut aujourd'hui ?"], ["B", "Bonjour. Elles sont à combien, vos tomates ?"], ["A", "Trois euros le kilo. Elles sont très bonnes, elles viennent de la région."], ["B", "Alors j'en prends un kilo. Et je voudrais aussi une barquette de fraises."], ["A", "Les fraises, c'est fini pour aujourd'hui, désolé. Mais j'ai des abricots, deux euros cinquante le kilo."], ["B", "Très bien, donnez-m'en un demi-kilo."], ["A", "Voilà. Avec ceci ?"], ["B", "Ce sera tout, merci."]], "qs": [{"q": "Combien coûtent les tomates ?", "o": ["3 € le kilo", "2,50 € le kilo", "3 € la barquette", "5 € le kilo"], "a": 0, "w": "« Trois euros le kilo »."}, {"q": "Pourquoi le client n'achète-t-il pas de fraises ?", "o": ["Il n'y en a plus", "Elles sont trop chères", "Il ne les aime pas", "Elles sont abîmées"], "a": 0, "w": "« c'est fini pour aujourd'hui » = sold out for today."}, {"q": "Combien d'abricots achète-t-il ?", "o": ["Un demi-kilo", "Un kilo et demi", "Deux kilos", "Une barquette"], "a": 0, "w": "« donnez-m'en un demi-kilo » = give me half a kilo."}], "ex": ["Trois euros le kilo.", "Les fraises, c'est fini pour aujourd'hui", "donnez-m'en un demi-kilo"], "vocab": [["Qu'est-ce qu'il vous faut", "What do you need"], ["Elles sont à combien", "How much are they"], ["le kilo", "per kilo"], ["viennent de la région", "are local"], ["j'en prends", "I'll take (some)"], ["une barquette de fraises", "a punnet of strawberries"], ["c'est fini pour aujourd'hui", "sold out for today"], ["Avec ceci", "Anything else"], ["Ce sera tout", "That will be all"]], "learn": [["Elles sont à combien, vos tomates ?", "How much are your tomatoes?"], ["J'en prends un kilo.", "I'll take a kilo (of them)."], ["Ce sera tout, merci.", "That's all, thank you."]], "gram": "en replaces a quantity of something already named: des tomates → j'en prends un kilo. donnez-m'en = give me some.", "bonus": "Qu'est-ce que le client achète au marché ?", "bonusRef": "Il achète un kilo de tomates et un demi-kilo d'abricots.", "text": "Bonjour ! Qu'est-ce qu'il vous faut aujourd'hui ? Bonjour. Elles sont à combien, vos tomates ? Trois euros le kilo. Elles sont très bonnes, elles viennent de la région. Alors j'en prends un kilo. Et je voudrais aussi une barquette de fraises. Les fraises, c'est fini pour aujourd'hui, désolé. Mais j'ai des abricots, deux euros cinquante le kilo. Très bien, donnez-m'en un demi-kilo. Voilà. Avec ceci ? Ce sera tout, merci.", "audio": "audio/06.mp3"}, {"id": "p7", "title": "Appeler le plombier", "src": "Téléphone", "lines": [["A", "Allô, Plomberie Durand, bonjour."], ["B", "Bonjour monsieur. J'ai une fuite d'eau sous l'évier de la cuisine. Est-ce que vous pouvez venir ?"], ["A", "C'est une grosse fuite ?"], ["B", "Non, ça goutte, mais il y a de l'eau par terre tous les matins."], ["A", "D'accord. Je peux passer mardi matin, entre neuf heures et onze heures. Ça vous va ?"], ["B", "Oui, parfait. J'habite au 12, rue des Lilas, au deuxième étage."], ["A", "Très bien. En attendant, fermez le robinet sous l'évier. À mardi !"]], "qs": [{"q": "Où est la fuite ?", "o": ["Sous l'évier", "Sous la douche", "Dans les toilettes", "Dans la salle de bains"], "a": 0, "w": "« une fuite d'eau sous l'évier de la cuisine »."}, {"q": "Quand le plombier va-t-il venir ?", "o": ["Mardi matin", "Mardi soir", "Demain matin", "Lundi matin"], "a": 0, "w": "« Je peux passer mardi matin »."}, {"q": "Que doit faire le client en attendant ?", "o": ["Fermer le robinet", "Changer l'évier", "Appeler les pompiers", "Ouvrir la fenêtre"], "a": 0, "w": "« fermez le robinet sous l'évier » = turn off the tap under the sink."}], "ex": ["J'ai une fuite d'eau sous l'évier de la cuisine.", "Je peux passer mardi matin, entre neuf heures et onze heures.", "En attendant, fermez le robinet sous l'évier."], "vocab": [["une fuite d'eau", "a water leak"], ["sous l'évier", "under the sink"], ["ça goutte", "it's dripping"], ["par terre", "on the floor"], ["Je peux passer", "I can come round"], ["Ça vous va", "Does that suit you"], ["au deuxième étage", "on the second floor"], ["fermez le robinet", "turn off the tap"], ["En attendant", "In the meantime"]], "learn": [["J'ai une fuite d'eau sous l'évier.", "I have a water leak under the sink."], ["Est-ce que vous pouvez venir mardi ?", "Can you come on Tuesday?"], ["J'habite au deuxième étage.", "I live on the second floor."]], "gram": "Polite orders with vous: fermez, appelez, venez (no vous before the verb). Ça vous va ? = Does that suit you?", "bonus": "Quel est le problème du client ?", "bonusRef": "Il a une fuite d'eau sous l'évier de la cuisine.", "text": "Allô, Plomberie Durand, bonjour. Bonjour monsieur. J'ai une fuite d'eau sous l'évier de la cuisine. Est-ce que vous pouvez venir ? C'est une grosse fuite ? Non, ça goutte, mais il y a de l'eau par terre tous les matins. D'accord. Je peux passer mardi matin, entre neuf heures et onze heures. Ça vous va ? Oui, parfait. J'habite au 12, rue des Lilas, au deuxième étage. Très bien. En attendant, fermez le robinet sous l'évier. À mardi !", "audio": "audio/07.mp3"}, {"id": "p8", "title": "La fête des voisins", "src": "Message vocal", "lines": [["N", "Salut, c'est Claire, ta voisine du troisième. On organise la fête des voisins vendredi soir, à partir de dix-neuf heures, dans le jardin de la résidence. Chacun apporte quelque chose à manger ou à boire. Moi, je fais une quiche. Si tu veux, tu peux apporter une salade ou un dessert. Et s'il pleut, on se retrouve dans le hall. Dis-moi si tu viens, d'accord ? À bientôt !"]], "qs": [{"q": "Quand est la fête ?", "o": ["Vendredi soir", "Samedi soir", "Vendredi midi", "Dimanche soir"], "a": 0, "w": "« vendredi soir, à partir de dix-neuf heures »."}, {"q": "Qu'est-ce que Claire prépare ?", "o": ["Une quiche", "Une salade", "Un dessert", "Des boissons"], "a": 0, "w": "« Moi, je fais une quiche »."}, {"q": "Où sera la fête s'il pleut ?", "o": ["Dans le hall", "Chez Claire", "Dans le jardin", "Dans la rue"], "a": 0, "w": "« s'il pleut, on se retrouve dans le hall »."}], "ex": ["vendredi soir, à partir de dix-neuf heures", "Moi, je fais une quiche.", "s'il pleut, on se retrouve dans le hall"], "vocab": [["ta voisine du troisième", "your neighbour on the third floor"], ["On organise", "We're organising"], ["à partir de", "from"], ["Chacun apporte", "Everyone brings"], ["quelque chose à manger", "something to eat"], ["tu peux apporter", "you can bring"], ["on se retrouve", "we'll meet"], ["Dis-moi si tu viens", "Let me know if you're coming"]], "learn": [["Chacun apporte quelque chose à manger.", "Everyone brings something to eat."], ["Je vais apporter un dessert.", "I'm going to bring a dessert."], ["Merci pour l'invitation, je viens avec plaisir !", "Thanks for the invitation, I'd love to come!"]], "gram": "on = nous in everyday French: on organise = we're organising. The verb stays singular: on se retrouve.", "bonus": "Qu'est-ce que tu vas apporter à la fête ?", "bonusRef": "Je vais apporter une salade.", "text": "Salut, c'est Claire, ta voisine du troisième. On organise la fête des voisins vendredi soir, à partir de dix-neuf heures, dans le jardin de la résidence. Chacun apporte quelque chose à manger ou à boire. Moi, je fais une quiche. Si tu veux, tu peux apporter une salade ou un dessert. Et s'il pleut, on se retrouve dans le hall. Dis-moi si tu viens, d'accord ? À bientôt !", "audio": "audio/08.mp3"}, {"id": "p9", "title": "À la Poste", "src": "Dialogue", "lines": [["B", "Bonjour, c'est pour envoyer ce colis au Canada."], ["A", "Bonjour. Posez-le sur la balance, s'il vous plaît… Il pèse deux kilos trois cents. Vous voulez un envoi normal ou rapide ?"], ["B", "Normal. Ça arrive en combien de temps ?"], ["A", "Entre huit et douze jours. Ça fait vingt-neuf euros. Vous devez aussi remplir ce formulaire pour la douane."], ["B", "Qu'est-ce que je dois écrire ?"], ["A", "Le contenu du colis, sa valeur et l'adresse du destinataire."]], "qs": [{"q": "Combien pèse le colis ?", "o": ["2,3 kilos", "3,2 kilos", "2 kilos", "1,3 kilo"], "a": 0, "w": "« deux kilos trois cents » = 2.3 kg."}, {"q": "En combien de temps le colis arrive-t-il ?", "o": ["8 à 12 jours", "2 à 3 jours", "12 à 15 jours", "Une semaine"], "a": 0, "w": "« Entre huit et douze jours »."}, {"q": "Qu'est-ce qu'il faut écrire, entre autres ?", "o": ["La valeur du colis", "Son numéro de téléphone", "Le poids du colis", "La date d'arrivée"], "a": 0, "w": "« Le contenu du colis, sa valeur et l'adresse du destinataire »."}], "ex": ["Il pèse deux kilos trois cents.", "Entre huit et douze jours.", "Le contenu du colis, sa valeur et l'adresse du destinataire."], "vocab": [["envoyer ce colis", "send this parcel"], ["Posez-le sur la balance", "Put it on the scales"], ["Il pèse", "It weighs"], ["un envoi normal ou rapide", "standard or express"], ["Ça arrive en combien de temps", "How long does it take"], ["remplir ce formulaire", "fill in this form"], ["la douane", "customs"], ["l'adresse du destinataire", "the recipient's address"]], "learn": [["C'est pour envoyer ce colis au Canada.", "I'd like to send this parcel to Canada."], ["Ça arrive en combien de temps ?", "How long does it take to arrive?"], ["Je dois remplir ce formulaire.", "I have to fill in this form."]], "gram": "Posez-le: in an order, the pronoun goes after the verb, with a hyphen (posez-le, donnez-moi).", "bonus": "Combien coûte l'envoi ?", "bonusRef": "L'envoi coûte vingt-neuf euros.", "text": "Bonjour, c'est pour envoyer ce colis au Canada. Bonjour. Posez-le sur la balance, s'il vous plaît… Il pèse deux kilos trois cents. Vous voulez un envoi normal ou rapide ? Normal. Ça arrive en combien de temps ? Entre huit et douze jours. Ça fait vingt-neuf euros. Vous devez aussi remplir ce formulaire pour la douane. Qu'est-ce que je dois écrire ? Le contenu du colis, sa valeur et l'adresse du destinataire.", "audio": "audio/09.mp3"}, {"id": "p10", "title": "Réserver au restaurant", "src": "Téléphone", "lines": [["A", "Restaurant La Calanque, bonjour."], ["B", "Bonjour, je voudrais réserver une table pour samedi soir, s'il vous plaît."], ["A", "Pour combien de personnes ?"], ["B", "Pour quatre personnes, vers vingt heures."], ["A", "Vingt heures, c'est complet, mais j'ai une table à vingt heures trente, en terrasse."], ["B", "D'accord, vingt heures trente, c'est parfait."], ["A", "C'est à quel nom ?"], ["B", "Lambert. L, A, M, B, E, R, T."], ["A", "Très bien, monsieur Lambert, c'est noté. À samedi !"]], "qs": [{"q": "Pour quand est la réservation ?", "o": ["Samedi soir", "Samedi midi", "Vendredi soir", "Dimanche soir"], "a": 0, "w": "« pour samedi soir »."}, {"q": "Pour combien de personnes ?", "o": ["Quatre", "Deux", "Trois", "Quatorze"], "a": 0, "w": "« Pour quatre personnes »."}, {"q": "Pourquoi la table est-elle à 20 h 30 ?", "o": ["20 h, c'est complet", "Le client arrive tard", "Le restaurant ouvre tard", "La salle est fermée"], "a": 0, "w": "« Vingt heures, c'est complet » = 8 pm is fully booked."}], "ex": ["je voudrais réserver une table pour samedi soir", "Pour quatre personnes, vers vingt heures.", "Vingt heures, c'est complet, mais j'ai une table à vingt heures trente"], "vocab": [["réserver une table", "book a table"], ["Pour combien de personnes", "For how many people"], ["vers vingt heures", "around 8 pm"], ["c'est complet", "it's fully booked"], ["en terrasse", "outside, on the terrace"], ["C'est à quel nom", "What name is it under"], ["c'est noté", "that's booked"], ["À samedi", "See you on Saturday"]], "learn": [["Je voudrais réserver une table pour quatre personnes.", "I'd like to book a table for four."], ["C'est au nom de Petrenko.", "It's under the name Petrenko."], ["C'est complet ce soir ?", "Are you fully booked tonight?"]], "gram": "vers + time = around: vers vingt heures. à + time = exactly: à vingt heures trente.", "bonus": "À quelle heure est la réservation ?", "bonusRef": "La réservation est à vingt heures trente.", "text": "Restaurant La Calanque, bonjour. Bonjour, je voudrais réserver une table pour samedi soir, s'il vous plaît. Pour combien de personnes ? Pour quatre personnes, vers vingt heures. Vingt heures, c'est complet, mais j'ai une table à vingt heures trente, en terrasse. D'accord, vingt heures trente, c'est parfait. C'est à quel nom ? Lambert. L, A, M, B, E, R, T. Très bien, monsieur Lambert, c'est noté. À samedi !", "audio": "audio/10.mp3"}, {"id": "p11", "title": "Annonce : le train pour Toulon", "src": "Leçon 4", "lines": [["N", "Mesdames et messieurs, le train TER à destination de Toulon, prévu à dix-sept heures quarante, partira avec quinze minutes de retard, voie C. Nous vous prions de nous excuser."]], "qs": [{"q": "Le train va à :", "o": ["Toulon", "Marseille", "Nice"], "a": 0, "w": "« à destination de Toulon » = going to Toulon."}, {"q": "Le train devait partir à :", "o": ["17 h 40", "17 h 14", "15 h 40"], "a": 0, "w": "« prévu à dix-sept heures quarante »."}, {"q": "Le train part :", "o": ["en retard", "à l'heure", "en avance"], "a": 0, "w": "« quinze minutes de retard » = 15 minutes late."}], "ex": ["à destination de Toulon", "prévu à dix-sept heures quarante", "partira avec quinze minutes de retard"], "vocab": [["à destination de", "going to"], ["prévu à", "planned at"], ["de retard", "late"], ["voie C", "platform C"], ["Nous vous prions de nous excuser", "We apologise"]], "learn": [["Le train a quinze minutes de retard.", "The train is fifteen minutes late."], ["Il part de quelle voie ?", "Which platform does it leave from?"], ["Le train est à l'heure.", "The train is on time."]], "gram": "le retard = delay · en avance = early · à l'heure = on time · la voie, le quai = the platform.", "bonus": "À quelle heure le train va-t-il partir ?", "bonusRef": "Le train va partir à dix-sept heures cinquante-cinq.", "text": "Mesdames et messieurs, le train TER à destination de Toulon, prévu à dix-sept heures quarante, partira avec quinze minutes de retard, voie C. Nous vous prions de nous excuser.", "audio": "audio/11.mp3"}, {"id": "p12", "title": "Appeler le cabinet médical", "src": "Leçon 5", "lines": [["A", "Cabinet du docteur Martin, bonjour."], ["B", "Bonjour madame. Je voudrais prendre rendez-vous avec le docteur Martin, s'il vous plaît."], ["A", "Oui. C'est pour quoi ?"], ["B", "J'ai mal au dos depuis une semaine."], ["A", "Jeudi à 10 heures, ça vous va ?"], ["B", "Jeudi, ce n'est pas possible, je travaille. Est-ce que vous avez un rendez-vous vendredi ?"], ["A", "Vendredi à 17 h 30."], ["B", "Vendredi à 17 h 30, c'est parfait. Je dois apporter quelque chose ?"], ["A", "Votre carte Vitale. Vous êtes monsieur… ?"], ["B", "Petrenko. P, E, T, R, E, N, K, O. Ivan."], ["A", "C'est noté."], ["B", "Merci beaucoup, madame. Au revoir."]], "qs": [{"q": "Pourquoi Ivan appelle-t-il ?", "o": ["Il a mal au dos", "Il a de la fièvre", "Il a mal à la tête", "Il veut un certificat"], "a": 0, "w": "« J'ai mal au dos depuis une semaine »."}, {"q": "Pourquoi il ne prend pas jeudi ?", "o": ["Il travaille", "Il est en vacances", "Le docteur est absent", "C'est trop tôt"], "a": 0, "w": "« Jeudi, ce n'est pas possible, je travaille »."}, {"q": "Qu'est-ce qu'il doit apporter ?", "o": ["Sa carte Vitale", "Son passeport", "Une ordonnance", "De l'argent liquide"], "a": 0, "w": "« Votre carte Vitale »."}], "ex": ["J'ai mal au dos depuis une semaine.", "Jeudi, ce n'est pas possible, je travaille.", "Votre carte Vitale."], "vocab": [["prendre rendez-vous", "make an appointment"], ["C'est pour quoi", "What is it for"], ["J'ai mal au dos", "My back hurts"], ["depuis une semaine", "for a week"], ["ça vous va", "does that suit you"], ["ce n'est pas possible", "it's not possible"], ["Je dois apporter quelque chose", "Do I need to bring anything"], ["C'est noté", "It's booked"]], "learn": [["Je voudrais prendre rendez-vous avec le docteur.", "I'd like to make an appointment with the doctor."], ["J'ai mal au dos depuis une semaine.", "My back has been hurting for a week."], ["Petrenko : P, E, T, R, E, N, K, O.", "Petrenko: P, E, T, R, E, N, K, O."]], "gram": "Spelling your name: V = vé, E = e, R = erre, G = jé, U = u, N = enne. The examiner often asks for it!", "bonus": "Quel jour et à quelle heure est le rendez-vous ?", "bonusRef": "Le rendez-vous est vendredi à dix-sept heures trente.", "text": "Cabinet du docteur Martin, bonjour. Bonjour madame. Je voudrais prendre rendez-vous avec le docteur Martin, s'il vous plaît. Oui. C'est pour quoi ? J'ai mal au dos depuis une semaine. Jeudi à 10 heures, ça vous va ? Jeudi, ce n'est pas possible, je travaille. Est-ce que vous avez un rendez-vous vendredi ? Vendredi à 17 h 30. Vendredi à 17 h 30, c'est parfait. Je dois apporter quelque chose ? Votre carte Vitale. Vous êtes monsieur… ? Petrenko. P, E, T, R, E, N, K, O. Ivan. C'est noté. Merci beaucoup, madame. Au revoir.", "audio": "audio/12.mp3"}], "GS": [{"id": "etre", "title": "Être, avoir, aller, faire", "rl": "Recto · Conjugaison", "vl": "Verso · Expressions", "cols": ["", "être", "avoir", "aller", "faire"], "rows": [["je", "je suis", "j'ai", "je vais", "je fais"], ["tu", "tu es", "tu as", "tu vas", "tu fais"], ["il / elle / on", "il est", "il a", "il va", "il fait"], ["nous", "nous sommes", "nous avons", "nous allons", "nous faisons"], ["vous", "vous êtes", "vous avez", "vous allez", "vous faites"], ["ils / elles", "ils sont", "ils ont", "ils vont", "ils font"]], "keys": [["remember", "The four most useful verbs", "Learn them by heart: they are irregular and they are everywhere."], ["trap", "⚠ vous faites", "faire with vous: vous faites, never « vous faisez »."], ["trap", "⚠ Age = avoir", "J'ai 40 ans (never « je suis 40 »)."]], "uses": [["remember", "avoir + noun", "avoir faim (hungry), avoir soif (thirsty), avoir froid, avoir chaud, avoir mal à la tête, avoir besoin de, avoir rendez-vous"], ["remember", "être + adjective", "être fatigué, être en retard, être d'accord, être prêt"], ["remember", "faire + activity", "faire les courses, faire la cuisine, faire du sport, il fait beau (weather)"], ["idiom", "Learn as they are", "Ça va ? · Il y a… (there is) · Ça fait combien ? · Je vais bien."]], "errs": [["Je suis 40 ans.", "J'ai 40 ans."], ["Je suis faim.", "J'ai faim."], ["Vous faisez quoi ?", "Vous faites quoi ?"], ["Il a allé au marché.", "Il est allé au marché."]], "learn": [["J'ai faim, on va manger ?", "I'm hungry, shall we go and eat?"], ["Je suis fatigué ce soir.", "I'm tired tonight."], ["Vous faites quoi ce week-end ?", "What are you doing this weekend?"], ["Il fait beau aujourd'hui.", "The weather is nice today."], ["J'ai rendez-vous chez le médecin.", "I have a doctor's appointment."]]}, {"id": "pc", "title": "Le passé composé", "rl": "Recto · Être ou avoir", "vl": "Verso · Imparfait ou passé composé", "cols": ["Verbe", "Participe", "Exemple avec être"], "rows": [["aller", "allé", "Je suis allé au marché."], ["venir", "venu", "Elle est venue hier."], ["partir", "parti", "Ils sont partis à huit heures."], ["arriver", "arrivé", "Nous sommes arrivés tard."], ["sortir", "sorti", "Elle est sortie avec des amis."], ["rester", "resté", "Je suis resté à la maison."], ["tomber", "tombé", "Il est tombé dans la rue."], ["se lever", "levé", "Je me suis levé tôt."]], "keys": [["remember", "Avoir: most verbs", "j'ai mangé, j'ai pris (prendre), j'ai fait (faire), j'ai vu (voir), j'ai eu (avoir), j'ai été (être)"], ["remember", "Être: the participle agrees", "il est parti · elle est partie · ils sont partis · elles sont parties"], ["trap", "⚠ ne … pas", "around avoir or être: je n'ai pas mangé, elle n'est pas venue"]], "uses": [["remember", "Passé composé = one event", "Hier, j'ai reçu un appel. Il est arrivé à midi."], ["remember", "Imparfait = background, habit, description", "Il pleuvait. Avant, j'allais à la plage tous les jours. La maison était grande."], ["note", "Both together", "Je regardais la télé (background) quand tu as téléphoné (event)."], ["remember", "Imparfait endings", "je -ais, tu -ais, il -ait, nous -ions, vous -iez, ils -aient"]], "errs": [["J'ai allé au marché.", "Je suis allé au marché."], ["Elle est parti.", "Elle est partie."], ["Je m'ai levé.", "Je me suis levé."], ["J'ai prendu le bus.", "J'ai pris le bus."]], "learn": [["Hier, je suis allé au marché.", "Yesterday I went to the market."], ["Je me suis levé à sept heures.", "I got up at seven."], ["Nous avons fait les courses.", "We did the shopping."], ["Il pleuvait quand je suis sorti.", "It was raining when I went out."], ["Quand j'étais petit, j'allais à l'école à pied.", "When I was little, I walked to school."]]}, {"id": "art", "title": "Le, un, du : les articles", "rl": "Recto · Les articles", "vl": "Verso · Le genre", "cols": ["", "masculin", "féminin", "voyelle", "pluriel"], "rows": [["the", "le pain", "la salade", "l'eau", "les pommes"], ["a, an", "un croissant", "une baguette", "un ami", "des pommes"], ["some", "du pain", "de la salade", "de l'eau", "des pommes"], ["not any", "pas de pain", "pas de salade", "pas d'eau", "pas de pommes"], ["quantity", "un peu de pain", "une tranche de jambon", "un verre d'eau", "un kilo de pommes"]], "keys": [["remember", "aimer → le", "J'aime le café (coffee in general)."], ["remember", "boire, manger, acheter → du", "Je bois du café (some coffee)."], ["trap", "⚠ After a negative", "du, de la, des → de: je ne bois pas de café."]], "uses": [["remember", "Often feminine", "-tion, -té, -ure, -ette: la station, la santé, la voiture, la baguette"], ["remember", "Often masculine", "-ment, -age, -eau: le moment, le fromage, le bateau"], ["trap", "⚠ Exceptions", "le problème, le système, la plage, l'eau (feminine)"], ["remember", "son / sa: the object decides", "sa clé, son téléphone, for a man or a woman"]], "errs": [["Je bois le café le matin.", "Je bois du café le matin."], ["Il n'y a pas du lait.", "Il n'y a pas de lait."], ["un kilo des tomates", "un kilo de tomates"], ["une problème", "un problème"]], "learn": [["Je voudrais du pain et de l'eau.", "I'd like some bread and some water."], ["Il n'y a plus de lait.", "There's no milk left."], ["J'aime le fromage, mais je ne mange pas de viande.", "I like cheese, but I don't eat meat."], ["Un kilo de tomates, s'il vous plaît.", "A kilo of tomatoes, please."], ["Elle a perdu son téléphone.", "She lost her phone."]]}, {"id": "pron", "title": "Le, lui, y, en : les pronoms", "rl": "Recto · Les pronoms", "vl": "Verso · Avec ou sans à", "cols": ["Pronom", "Remplace", "Exemple"], "rows": [["le / la / les", "a thing or a person, no à", "Tu vois Paul ? Je le vois."], ["lui / leur", "à + a person", "Tu parles à Anna ? Je lui parle."], ["y", "à + a place", "Tu vas à la poste ? J'y vais."], ["en", "du, de la, des + noun, a quantity", "Tu veux du café ? J'en veux."]], "keys": [["remember", "Before the verb", "Je le vois. Je lui téléphone. (not « je vois le »)"], ["remember", "Passé composé: before avoir or être", "Je l'ai vu. J'y suis allé."], ["remember", "In an order: after, with a hyphen", "Donnez-moi. Posez-le. Vas-y !"]], "uses": [["remember", "Verbs with à → lui, leur", "téléphoner à, parler à, écrire à, donner à, demander à, répondre à"], ["remember", "Verbs without à → le, la, les", "voir, aider, appeler, attendre, écouter, regarder"], ["trap", "⚠ English is different", "I call her = je l'appelle (appeler, no à) · I phone her = je lui téléphone (téléphoner à)"]], "errs": [["Je la téléphone.", "Je lui téléphone."], ["Je vois le.", "Je le vois."], ["Du pain ? Oui, je le veux.", "Du pain ? Oui, j'en veux."], ["Je vais à là.", "J'y vais."]], "learn": [["Je l'ai vu hier.", "I saw him yesterday."], ["Je lui téléphone ce soir.", "I'm phoning him tonight."], ["Tu vas au marché ? Oui, j'y vais.", "Are you going to the market? Yes, I'm going (there)."], ["Des enfants ? J'en ai deux.", "Children? I have two."], ["Donnez-moi deux baguettes, s'il vous plaît.", "Give me two baguettes, please."]]}], "SP": [{"id": "s1", "t": "lire", "fr": "Je voudrais deux baguettes, s'il vous plaît.", "en": "I'd like two baguettes, please.", "cat": "lire"}, {"id": "s2", "t": "lire", "fr": "J'ai mal à la gorge depuis deux jours.", "en": "I've had a sore throat for two days.", "cat": "lire"}, {"id": "s3", "t": "lire", "fr": "Est-ce que vous pouvez venir mardi matin ?", "en": "Can you come on Tuesday morning?", "cat": "lire"}, {"id": "s4", "t": "lire", "fr": "Je voudrais réserver une table pour quatre personnes.", "en": "I'd like to book a table for four.", "cat": "lire"}, {"id": "s5", "t": "lire", "fr": "Pourriez-vous parler plus lentement, s'il vous plaît ?", "en": "Could you speak more slowly, please?", "cat": "lire"}, {"id": "s6", "t": "lire", "fr": "Hier, nous sommes allés au marché.", "en": "Yesterday we went to the market.", "cat": "lire"}, {"id": "s7", "t": "lire", "fr": "Il faut que je fasse les courses.", "en": "I have to do the shopping.", "cat": "lire"}, {"id": "s8", "t": "lire", "fr": "Quand j'étais petit, j'allais à l'école à pied.", "en": "When I was little, I walked to school.", "cat": "lire"}, {"id": "t1", "t": "sit", "en": "At the bakery: ask for a baguette and two croissants, politely.", "fr": "Bonjour, je voudrais une baguette et deux croissants, s'il vous plaît.", "cat": "sit"}, {"id": "t2", "t": "sit", "en": "Call the doctor's office: you would like an appointment, this week if possible.", "fr": "Bonjour, je voudrais prendre rendez-vous avec le docteur, cette semaine si possible.", "cat": "sit"}, {"id": "t3", "t": "sit", "en": "Introduce yourself: your name, where you live, where you come from.", "fr": "Je m'appelle Ivan Petrenko. J'habite à Marseille, mais je viens d'Ukraine.", "cat": "sit"}, {"id": "t4", "t": "sit", "en": "Tell your neighbour what you did last weekend (two sentences, passé composé).", "fr": "Samedi, je suis allé au marché et j'ai acheté des légumes. Dimanche, je me suis reposé à la maison.", "cat": "sit"}, {"id": "t5", "t": "sit", "en": "At the pharmacy: you have had a headache since yesterday. Ask for something.", "fr": "Bonjour, j'ai mal à la tête depuis hier. Vous avez quelque chose ?", "cat": "sit"}, {"id": "t6", "t": "sit", "en": "On the phone with a plumber: your shower is leaking. Ask if he can come tomorrow.", "fr": "Bonjour, ma douche fuit. Est-ce que vous pouvez venir demain ?", "cat": "sit"}, {"id": "t7", "t": "sit", "en": "In the street: ask someone where the post office is.", "fr": "Excusez-moi, où est la poste, s'il vous plaît ?", "cat": "sit"}, {"id": "t8", "t": "sit", "en": "Say two things you are going to do tomorrow (futur proche).", "fr": "Demain, je vais faire les courses et je vais appeler ma famille.", "cat": "sit"}, {"id": "t9", "t": "sit", "en": "In a café: order a coffee and a glass of water.", "fr": "Je voudrais un café et un verre d'eau, s'il vous plaît.", "cat": "sit"}, {"id": "t10", "t": "sit", "en": "Describe your home in two sentences.", "fr": "J'habite dans un appartement au deuxième étage. Il y a deux chambres et un balcon.", "cat": "sit"}, {"id": "t11", "t": "sit", "en": "Say what you did when you were a child (imparfait).", "fr": "Quand j'étais petit, j'allais à l'école à pied et je jouais au football.", "cat": "sit"}, {"id": "t12", "t": "sit", "en": "Invite a friend to dinner on Saturday evening.", "fr": "Tu veux venir dîner chez nous samedi soir ?", "cat": "sit"}, {"id": "u1", "t": "sit", "cat": "pres", "en": "Comment vous appelez-vous ?", "fr": "Je m'appelle Ivan Petrenko."}, {"id": "u2", "t": "sit", "cat": "pres", "en": "Quel âge avez-vous ?", "fr": "J'ai 45 ans."}, {"id": "u3", "t": "sit", "cat": "pres", "en": "D'où venez-vous ? Quelle est votre nationalité ?", "fr": "Je viens d'Ukraine. Je suis ukrainien."}, {"id": "u4", "t": "sit", "cat": "pres", "en": "Où habitez-vous ? Depuis quand ?", "fr": "J'habite à Marseille depuis … ans."}, {"id": "u5", "t": "sit", "cat": "pres", "en": "Qu'est-ce que vous faites dans la vie ?", "fr": "Dans la vie, je suis … / je travaille comme …"}, {"id": "u6", "t": "sit", "cat": "pres", "en": "Qu'est-ce que vous aimez faire le week-end ?", "fr": "Le week-end, j'aime me promener au bord de la mer et cuisiner."}, {"id": "u7", "t": "sit", "cat": "pres", "en": "Pourquoi apprenez-vous le français ?", "fr": "J'apprends le français parce que j'habite en France et parce que c'est important pour parler avec les gens."}, {"id": "u8", "t": "sit", "cat": "pres", "en": "Présentez-vous en une minute (tout ensemble).", "fr": "Bonjour. Je m'appelle Ivan Petrenko. J'ai 45 ans. Je suis ukrainien. J'habite à Marseille. Le week-end, j'aime me promener au bord de la mer. J'apprends le français parce que j'habite en France et parce que c'est important pour parler avec les gens."}, {"id": "v1", "t": "sit", "cat": "sit", "en": "À la gare Saint-Charles : vous voulez un billet pour Nice samedi matin. Demandez l'heure du train, le prix, et si vous pouvez payer par carte.", "fr": "Bonjour monsieur. Je voudrais un billet pour Nice, samedi matin, s'il vous plaît. À quelle heure part le train ? Ça coûte combien ? Est-ce que je peux payer par carte ?"}, {"id": "v2", "t": "sit", "cat": "sit", "en": "Dans un magasin : vous voulez un cadeau pour l'anniversaire d'un ami. Demandez le prix, la couleur, et si vous pouvez l'échanger.", "fr": "Bonjour madame. Je cherche un cadeau pour l'anniversaire d'un ami. Combien coûte ce pull ? Est-ce que vous l'avez en bleu ? Et si la taille ne va pas, est-ce que mon ami peut l'échanger ?"}, {"id": "v3", "t": "sit", "cat": "sit", "en": "Au téléphone avec le cabinet médical : vous avez mal au dos depuis une semaine. Prenez rendez-vous.", "fr": "Bonjour madame. Je voudrais prendre rendez-vous avec le docteur, s'il vous plaît. J'ai mal au dos depuis une semaine."}, {"id": "v4", "t": "sit", "cat": "sit", "en": "Vous n'avez pas compris l'examinateur. Demandez-lui de répéter, poliment.", "fr": "Pardon, vous pouvez répéter, s'il vous plaît ? Vous pouvez parler plus lentement ?"}, {"id": "o1", "t": "sit", "cat": "avis", "en": "« Vous préférez vivre en ville ou à la campagne ? »", "fr": "À mon avis, c'est mieux de vivre en ville, parce qu'il y a beaucoup de magasins, de transports et de travail. Par exemple, à Marseille, je prends le métro et le bus. Mais la ville, c'est aussi bruyant et cher. Donc, pour moi, l'idéal, c'est d'habiter en ville et d'aller à la campagne le week-end."}, {"id": "o2", "t": "sit", "cat": "avis", "en": "« Est-ce que c'est important d'apprendre la langue du pays où on habite ? Pourquoi ? »", "fr": "Je pense que c'est très important, parce qu'on peut parler avec les voisins, travailler et faire ses démarches seul. Par exemple, chez le médecin, c'est plus facile si on parle français. Mais c'est difficile quand on est adulte. Donc, pour moi, il faut apprendre un peu tous les jours."}, {"id": "o3", "t": "sit", "cat": "avis", "en": "« Vous préférez faire les courses au marché ou au supermarché ? »", "fr": "Je préfère le marché, parce que les fruits et les légumes sont frais et viennent de la région. Par exemple, au marché, je parle avec les vendeurs. Mais le supermarché est plus pratique et ouvert plus tard. Donc, je vais au marché le week-end et au supermarché pendant la semaine."}, {"id": "o4", "t": "sit", "cat": "avis", "en": "« Pour vous, qu'est-ce qui est le plus important pour bien vivre dans un nouveau pays ? »", "fr": "Pour moi, le plus important, c'est d'apprendre la langue, parce qu'on peut comprendre les gens et trouver du travail. Par exemple, quand je parle français, je me sens plus libre. Mais il faut aussi respecter les règles et la culture du pays. Donc, la langue et le respect, c'est le plus important."}], "RD": [{"id": "d1", "title": "Une affiche sur une porte", "src": "Leçon 2", "text": "PHARMACIE CENTRALE\nFermée le dimanche.\nPharmacie de garde ce week-end : Pharmacie du Port, 12 quai de Rive-Neuve.", "qs": [{"q": "Le dimanche, la Pharmacie Centrale est :", "o": ["fermée", "ouverte le matin", "ouverte toute la journée"], "a": 0, "w": "« Fermée le dimanche » = closed on Sunday."}, {"q": "Si vous avez besoin d'un médicament dimanche, vous allez :", "o": ["à la Pharmacie du Port", "à la Pharmacie Centrale", "à l'hôpital"], "a": 0, "w": "pharmacie de garde = the pharmacy that is open on Sunday or at night."}], "words": [["fermé(e)", "closed"], ["ouvert(e)", "open"], ["la pharmacie de garde", "the duty pharmacy (open on Sunday or at night)"]]}, {"id": "d2", "title": "Un SMS", "src": "Leçon 2", "text": "Salut Ivan ! On fait un pique-nique samedi midi au parc Borély. Tu viens ? Apporte des boissons, moi j'apporte les sandwichs. Réponds-moi avant jeudi ! Olga", "qs": [{"q": "Le pique-nique a lieu :", "o": ["samedi midi", "jeudi soir", "dimanche midi"], "a": 0, "w": "« samedi midi »."}, {"q": "Ivan doit apporter :", "o": ["des boissons", "des sandwichs", "un gâteau"], "a": 0, "w": "« Apporte des boissons » = bring drinks."}, {"q": "Olga veut une réponse :", "o": ["avant jeudi", "samedi", "ce soir"], "a": 0, "w": "« Réponds-moi avant jeudi »."}], "words": [["apporter", "to bring"], ["avoir lieu", "to take place"], ["Réponds-moi", "Answer me"]]}, {"id": "d3", "title": "Une petite annonce", "src": "Leçon 2", "text": "COURS DE FRANÇAIS GRATUITS pour adultes\nLe mardi et le jeudi, de 18 h à 20 h, à la maison de quartier.\nInscription sur place, avec une pièce d'identité.", "qs": [{"q": "Pour s'inscrire, il faut :", "o": ["apporter une pièce d'identité", "payer 20 euros", "téléphoner"], "a": 0, "w": "« avec une pièce d'identité » = with an ID document."}], "words": [["gratuit", "free (no money)"], ["l'inscription", "registration"], ["sur place", "on site"], ["une pièce d'identité", "an ID document"]]}, {"id": "d4", "title": "Une convocation", "src": "Leçon 7", "text": "Objet : Convocation – Test de français\nMonsieur,\nVous êtes inscrit au test de français le mardi 17 novembre à 9 h 00.\nMerci d'arriver 30 minutes avant le début de l'épreuve.\nVous devez apporter : votre convocation et une pièce d'identité valide (passeport ou titre de séjour). Les téléphones portables sont interdits dans la salle.\nLe test dure environ 1 h 45. Les résultats seront disponibles dans 15 jours.\nLe centre d'examen", "qs": [{"q": "Le test commence à :", "o": ["9 h 00", "8 h 30", "9 h 30"], "a": 0, "w": "« le mardi 17 novembre à 9 h 00 »."}, {"q": "À quelle heure le candidat doit-il arriver ?", "o": ["8 h 30", "9 h 00", "9 h 45"], "a": 0, "w": "30 minutes before 9 h = 8 h 30."}, {"q": "Qu'est-ce qu'il ne faut PAS prendre dans la salle ?", "o": ["Le téléphone portable", "Le passeport", "La convocation"], "a": 0, "w": "« Les téléphones portables sont interdits »."}, {"q": "Les résultats arrivent :", "o": ["dans 15 jours", "le jour du test", "dans 2 mois"], "a": 0, "w": "« disponibles dans 15 jours »."}], "words": [["la convocation", "the official invitation"], ["valide", "valid"], ["l'épreuve", "the test"], ["interdit", "forbidden"]]}, {"id": "d5", "title": "Une lettre de la mairie", "src": "Leçon 7", "text": "MAIRIE – Service propreté\nMadame, Monsieur,\nLe ramassage des encombrants (vieux meubles, matelas, appareils électriques) est gratuit.\nPour en profiter, prenez rendez-vous par téléphone au 3001 ou sur le site de la mairie.\nDéposez vos objets devant votre immeuble la veille au soir du rendez-vous, après 19 heures.\nIl est interdit de déposer des objets sur le trottoir sans rendez-vous : amende possible.", "qs": [{"q": "Ce service est :", "o": ["gratuit", "payant", "réservé aux magasins"], "a": 0, "w": "« est gratuit »."}, {"q": "Quand faut-il sortir les objets ?", "o": ["La veille au soir, après 19 heures", "Le matin du rendez-vous", "N'importe quand"], "a": 0, "w": "la veille au soir = the evening before."}, {"q": "Si on dépose un vieux matelas sur le trottoir sans rendez-vous :", "o": ["on peut avoir une amende", "c'est autorisé", "la mairie paie"], "a": 0, "w": "« amende possible » = you can get a fine."}], "words": [["les encombrants", "big objects you throw away"], ["la veille", "the day before"], ["le trottoir", "the pavement"], ["une amende", "a fine"]]}, {"id": "d6", "title": "Sur la porte d'une boulangerie", "src": "Leçon 10", "text": "BOULANGERIE DU MARCHÉ\nOuvert du mardi au dimanche, de 7 h à 13 h et de 15 h 30 à 19 h 30.\nFermé le lundi.\nCongés annuels : du 1er au 15 août.", "qs": [{"q": "Le lundi, la boulangerie est :", "o": ["fermée", "ouverte le matin", "ouverte l'après-midi", "ouverte toute la journée"], "a": 0, "w": "« Fermé le lundi »."}, {"q": "Le mercredi à 14 h, la boulangerie est :", "o": ["fermée", "ouverte", "ouverte jusqu'à 15 h", "ouverte pour le pain"], "a": 0, "w": "14 h is between 13 h and 15 h 30: it is closed."}, {"q": "La boulangerie est en vacances :", "o": ["au début du mois d'août", "en juillet", "à Noël", "le dimanche"], "a": 0, "w": "« Congés annuels : du 1er au 15 août »."}], "words": [["du mardi au dimanche", "from Tuesday to Sunday"], ["les congés annuels", "the annual holidays"]]}, {"id": "d7", "title": "Un message d'une voisine", "src": "Leçon 10", "text": "Bonjour monsieur Petrenko,\nJe suis votre voisine du 2e étage. Je pars chez ma fille à Lyon du 3 au 10 novembre. Est-ce que vous pouvez prendre mon courrier dans la boîte aux lettres et donner à manger à mon chat, Minou, le matin ? Je vous laisse la clé demain soir.\nMerci beaucoup !\nMadame Lopez", "qs": [{"q": "Madame Lopez part :", "o": ["une semaine", "un jour", "un mois", "deux jours"], "a": 0, "w": "du 3 au 10 novembre = one week."}, {"q": "Elle demande à Ivan de :", "o": ["prendre le courrier et nourrir le chat", "arroser les plantes", "garder sa fille", "aller à Lyon"], "a": 0, "w": "« prendre mon courrier » + « donner à manger à mon chat »."}, {"q": "Quand va-t-elle donner la clé ?", "o": ["Demain soir", "Le 10 novembre", "Ce matin", "Le 3 novembre"], "a": 0, "w": "« Je vous laisse la clé demain soir »."}], "words": [["le courrier", "the mail"], ["la boîte aux lettres", "the letterbox"], ["donner à manger à", "to feed"]]}, {"id": "d8", "title": "Une offre d'emploi", "src": "Leçon 10", "text": "Entreprise de bâtiment à Marseille (13010) recherche PEINTRE (H/F).\nCDI, 35 heures par semaine, du lundi au vendredi.\nExpérience de 2 ans minimum. Permis B obligatoire.\nEnvoyez votre CV par e-mail.", "qs": [{"q": "Le travail est :", "o": ["du lundi au vendredi", "le week-end", "seulement le matin", "40 heures par semaine"], "a": 0, "w": "« 35 heures par semaine, du lundi au vendredi »."}, {"q": "Pour ce travail, il faut :", "o": ["avoir le permis de conduire", "avoir une voiture", "parler anglais", "un diplôme universitaire"], "a": 0, "w": "permis B obligatoire = driving licence needed."}, mposé: j'ai mangé, je suis allé.", "Movement verbs + être: je suis allé, je suis parti.", "Negative: je n'ai pas aimé."], "useful": ["Ce week-end, je suis allé à…", "J'ai visité…", "Nous avons mangé…", "Je me suis promené au bord de la mer.", "C'était super !"], "model": "Salut Marc !\nCe week-end, je suis allé à Cassis avec des amis. Samedi matin, nous avons pris le bus. Nous nous sommes promenés au bord de la mer et nous avons mangé du poisson dans un petit restaurant. Dimanche, je suis resté à la maison et j'ai regardé un film. J'ai beaucoup aimé ce week-end : il a fait très beau !\nÀ bientôt,\nIvan"}, {"id": "w3", "title": "Répondre à une voisine", "src": "Leçon 10", "n": "60 à 80 mots", "task": "Votre voisine, Madame Lopez, vous a demandé de garder son chat. Vous ne pouvez pas, parce que vous partez aussi. Écrivez-lui un message : vous vous excusez, vous expliquez pourquoi, et vous proposez une autre solution.", "points": ["vous vous excusez", "vous expliquez pourquoi", "vous proposez une autre solution"], "tips": ["A neighbour: vous, not tu.", "Start: Bonjour Madame Lopez,", "Finish: Bonne journée, + your full name."], "useful": ["Je suis désolé, mais…", "Je ne peux pas…, parce que…", "Je vous propose une solution :", "Vous êtes d'accord ?"], "model": "Bonjour Madame Lopez,\nMerci pour votre message. Je suis désolé, mais je ne peux pas garder Minou : je pars aussi à Toulon du 4 au 8 novembre pour voir des amis. Je vous propose une solution : mon ami Sacha habite au 5e étage, il aime beaucoup les chats. Je peux lui demander demain. Vous êtes d'accord ?\nBonne journée,\nIvan Petrenko"}, {"id": "w4", "title": "Une journée agréable", "src": "Leçon 10", "n": "80 à 100 mots", "task": "Racontez une journée agréable que vous avez passée à Marseille ou dans la région : où, quand, avec qui, ce que vous avez fait.", "points": ["où", "quand", "avec qui", "ce que vous avez fait"], "tips": ["Passé composé for the events: nous sommes allés, nous avons vu.", "Imparfait for th try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.read=S.read||{};S.write=S.write||{};S.num=S.num||{ok:0,n:0};

let R=null,SAMPLE=null,TTS=null,DICT=null;
try{window.claude&&window.claude.use&&window.claude.use("sample").then(s=>{SAMPLE=s}).catch(()=>{})}catch(e){}
try{window.claude&&window.claude.use&&window.claude.use("tts").then(t=>{TTS=t}).catch(()=>{})}catch(e){}
try{window.claude&&window.claude.use&&window.claude.use("dictation").then(d=>{DICT=d;if(d){d.onPartial(x=>REC.partial(x.text));d.onFinal(x=>REC.final(x.text));d.onState(x=>REC.state(x.state,x.reason))}}).catch(()=>{})}catch(e){}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").replace(/\s*([?!.:;])\s*$/,"").trim();
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

function mastery(f){const s=S.fam[f]||{seen:0,ok:0};return {seen:s.seen,pct:Math.round(100*(s.ok+1)/(s.seen+2))}}
function pick(){
 const pool=I;
 const due=pool.filter(x=>{const s=S.item[x.id];return s&&!s.last&&S.round-s.when>=1});
 const chosen=shuf(due).slice(0,3);
 const w=f=>0.6+3*(1-mastery(f).pct/100);
 const rest=pool.filter(x=>!chosen.includes(x)&&!(S.item[x.id]&&S.item[x.id].last&&S.round-S.item[x.id].when<3));
 let cand=rest.length>=10?rest:pool.filter(x=>!chosen.includes(x));
 while(chosen.length<10&&cand.length){
  const tot=cand.reduce((s,x)=>s+w(x.f),0);let r=Math.random()*tot,k=0;
  for(;k<cand.length;k++){r-=w(cand[k].f);if(r<=0)break}
  const it=cand[Math.min(k,cand.length-1)];chosen.push(it);cand=cand.filter(x=>x!==it&&!(x.f===it.f&&chosen.filter(c=>c.f===it.f).length>=3));
 }
 return shuf(chosen);
}

/* ---------- AUDIO OUT ---------- */
let AUD=null;
function stopAudio(){try{AUD&&AUD.pause()}catch(e){}try{TTS&&TTS.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
async function speak(text,slow,lines){
 stopAudio();
 const rate=slow?0.8:1;
 if(TTS){try{
   if(lines&&lines.length>1)await TTS.speak(lines.map(([s,t])=>({text:t,voice:s==="B"?"rounded":"airy",language:"fr",rate})));
   else await TTS.speak(text,{rate,language:"fr"});
   return true}catch(e){if(e&&e.code==="not_granted")TTS=null;else return true}}
 if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
  const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  const parts=lines&&lines.length>1?lines:[["A",text]];
  parts.forEach(([s,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=slow?0.75:0.92;if(vs.length)u.voice=vs[s==="B"&&vs.length>1?1:0];speechSynthesis.speak(u)});
  return true}
 return false;
}

/* ---------- AUDIO IN (speech to text) ---------- */
const REC={on:false,mode:null,sr:null,txt:"",tmp:"",box:null,btn:null,blocked:false,
 partial(t){this.tmp=t;this.paint()},final(t){this.txt=(this.txt+" "+t).trim();this.tmp="";this.paint()},
 state(st,reason){if(st==="idle"){this.on=false;this.ui()}else if(st==="listening"){this.on=true;this.ui()}},
 paint(){if(this.box)this.box.value=(this.txt+" "+this.tmp).trim()},
 ui(){if(this.btn){this.btn.textContent=this.on?"■ J'ai fini":"🎙 Parler";this.btn.setAttribute("aria-pressed",String(this.on))}},
 can(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)&&!this.blocked||!!DICT},
 start(box,btn,msg){
  this.box=box;this.btn=btn;this.txt=box.value.trim();this.tmp="";
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR&&!this.blocked){
   try{const r=new SR();r.lang="fr-FR";r.interimResults=true;r.continuous=true;
    r.onresult=e=>{let fin="",tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}if(fin)this.final(fin);this.partial(tmp)};
    r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){this.blocked=true;msg(DICT?"Micro bloqué ici : appuie encore sur 🎙 Parler.":"Micro non disponible : écris ta phrase.")}};
    r.onend=()=>{this.on=false;this.ui()};
    r.start();this.sr=r;this.mode="sr";this.on=true;this.ui();return}catch(e){this.blocked=true}
  }
  if(DICT){this.mode="dict";this.on=true;this.ui();DICT.start().catch(err=>{this.on=false;this.ui();msg(err&&err.code==="not_granted"?"Micro refusé : écris ta phrase.":"Micro non disponible : écris ta phrase.")});return}
  msg("Micro non disponible dans ce navigateur : écris ta phrase.");
 },
 stop(){this.on=false;this.ui();try{if(this.mode==="sr"&&this.sr)this.sr.stop();if(this.mode==="dict"&&DICT)DICT.stop()}catch(e){}}
};
function wireMic(box,btn,msgEl){
 const msg=t=>{msgEl.textContent=t;msgEl.hidden=false};
 btn.onclick=()=>{if(REC.on){REC.stop();return}msgEl.hidden=true;stopAudio();REC.start(box,btn,msg)};
}

async function ask(prompt){
 if(!SAMPLE)return null;
 try{
  if(typeof SAMPLE.json==="function")return await SAMPLE.json(prompt,{modelTier:"quick"});
  const t=(await SAMPLE(prompt,{modelTier:"quick"})).text;return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
 }catch(e){return null}
}

function start(){R={items:pick(),i:0,score:0,miss:[]};go(roundView)}
function roundView(){if(!R)return home();if(R.i>=R.items.length)return end(true);show()}
function practice(it){R={items:[it],i:0,score:0,miss:[],single:true};go(roundView)}
function show(){
 const it=R.items[R.i];
 const head=R.single?"":`<div class="prog" aria-hidden="true"><i style="width:${R.i*10}%"></i></div>`;
 const kind={mc:"Choisis la bonne réponse",type:"Écris le mot qui manque",drag:"Mets les mots dans les trous",order:"Construis la phrase"}[it.t];
 let body="";
 const gaps=s=>{let n=0;return esc(s).replace(/___/g,()=>`<span class="gap" data-g="${n++}" tabindex="0" role="button" aria-label="trou ${n}">&nbsp;</span>`)};
 if(it.t==="mc")body=`<p class="q">${esc(it.q).replace("___",'<span class="gap" aria-hidden="true">&nbsp;</span>')}</p><div class="opts">${shuf(it.o.map((o,k)=>[o,k])).map(([o,k])=>`<button type="button" class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
 if(it.t==="type")body=`<p class="q">${esc(it.q).replace("___",'<span class="gap" aria-hidden="true">&nbsp;</span>')}</p><label class="small" for="ans">Ta réponse (${esc(it.h)})</label><br><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="fr">`;
 if(it.t==="drag")body=`<p class="q">${gaps(it.q)}</p><div class="bank" id="bank">${shuf(it.b).map((w,k)=>`<button type="button" class="tile" draggable="true" data-w="${esc(w)}" data-t="${k}">${esc(w)}</button>`).join("")}</div>`;
 if(it.t==="order"){const ws=it.a.split(" ");body=`<p class="small">${esc(it.en)}</p><div class="line" id="line" aria-label="Ta phrase"></div><div class="bank" id="bank">${shuf(ws.map((w,k)=>[w,k])).map(([w,k])=>`<button type="button" class="tile" draggable="true" data-w="${esc(w)}" data-t="${k}">${esc(w)}</button>`).join("")}</div>`}
 stage.innerHTML=head+`<div class="card"><div class="cardhead"><b>${R.single?"Exercice":`Exercice ${R.i+1} / ${R.items.length}`}</b><span>${esc(FAM[it.f].n)}</span></div><div class="cardbody">
 <p class="small">${kind}</p>${body}
 <div class="act"><button class="btn" id="check" type="button">Vérifier</button><button class="btn ghost" id="hint" type="button">Indice</button><button class="btn ghost" id="conf" type="button">≠ Ne pas confondre</button><button class="btn ghost" id="skip" type="button">Je ne sais pas</button></div>
 <div class="fb" id="fb"></div><div id="bonusbox"></div></div></div>`;
 wire(it);
}
function wire(it){
 const st={mc:null,fill:[],line:[]};
 const check=document.getElementById("check");
 document.getElementById("skip").onclick=()=>grade(it,null,true);
 R.hinted=false;
 const hb=document.getElementById("hint"),cb=document.getElementById("conf");
 const add=(cls,lab,txt)=>document.getElementById("fb").insertAdjacentHTML("beforeend",pill(cls,lab,esc(txt)));
 hb.onclick=()=>{R.hinted=true;hb.disabled=true;add("remember","Indice",it.hq)};
 cb.onclick=()=>{R.hinted=true;cb.disabled=true;add("trap","≠ Ne pas confondre",it.nc)};
 if(it.t==="mc")stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));b.classList.add("on");st.mc=+b.dataset.k});
 if(it.t==="type"){const inp=document.getElementById("ans");inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")check.click()}}
 if(it.t==="drag"){
  const gs=[...stage.querySelectorAll(".gap")];let sel=0;
  const mark=()=>gs.forEach((g,k)=>g.classList.toggle("sel",k===sel));mark();
  const put=(tile,k)=>{if(st.fill[k])free(k);st.fill[k]=tile;gs[k].textContent=tile.dataset.w;tile.classList.add("used");const nx=gs.findIndex((g,j)=>!st.fill[j]);sel=nx<0?k:nx;mark()};
  const free=k=>{st.fill[k].classList.remove("used");st.fill[k]=null;gs[k].innerHTML="&nbsp;"};
  stage.querySelectorAll("#bank .tile").forEach(t=>{t.onclick=()=>put(t,sel);t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.t)}});
  gs.forEach((g,k)=>{g.onclick=()=>{if(st.fill[k])free(k);sel=k;mark()};g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.click()}};
   g.ondragover=e=>{e.preventDefault();g.classList.add("over")};g.ondragleave=()=>g.classList.remove("over");
   g.ondrop=e=>{e.preventDefault();g.classList.remove("over");const t=stage.querySelector(`#bank .tile[data-t="${e.dataTransfer.getData("text/plain")}"]`);if(t&&!t.classList.contains("used"))put(t,k)}});
 }
 if(it.t==="order"){
  const line=document.getElementById("line");
  const addT=t=>{const c=t.cloneNode(true);c.classList.remove("used");c.removeAttribute("draggable");line.appendChild(c);t.classList.add("used");st.line.push(t.dataset.w);
   c.onclick=()=>{const k=[...line.children].indexOf(c);st.line.splice(k,1);c.remove();t.classList.remove("used")}};
  stage.querySelectorAll("#bank .tile").forEach(t=>{t.onclick=()=>addT(t);t.ondragstart=e=>e.dataTransfer.setData("text/plain",t.dataset.t)});
  line.ondragover=e=>e.preventDefault();
  line.ondrop=e=>{e.preventDefault();const t=stage.querySelector(`#bank .tile[data-t="${e.dataTransfer.getData("text/plain")}"]`);if(t&&!t.classList.contains("used"))addT(t)};
 }
 check.onclick=()=>{
  let given;
  if(it.t==="mc"){if(st.mc===null)return;given=st.mc}
  if(it.t==="type"){given=document.getElementById("ans").value;if(!given.trim())return}
  if(it.t==="drag"){const n=stage.querySelectorAll(".gap").length;if(st.fill.filter(Boolean).length<n)return;given=st.fill.map(t=>t.dataset.w)}
  if(it.t==="order"){if(!st.line.length)return;given=st.line.join(" ")}
  grade(it,given,false);
 };
}
function grade(it,given,skipped){
 let ok=false,shown="";
 if(!skipped){
  if(it.t==="mc"){ok=given===it.a;shown=it.o[given];stage.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;if(k===it.a)b.classList.add("good");else if(k===given)b.classList.add("bad")})}
  if(it.t==="type"){ok=it.a.some(a=>norm(a)===norm(given));shown=given}
  if(it.t==="drag"){ok=given.every((g,k)=>g===it.a[k]);shown=given.join(" / ")}
  if(it.t==="order"){ok=norm(given)===norm(it.a);shown=given}
 }
 const fs=S.fam[it.f]||(S.fam[it.f]={seen:0,ok:0});fs.seen++;if(ok)fs.ok+=R.hinted?0.5:1;
 S.item[it.id]={last:ok&&!R.hinted,when:S.round};
 if(ok)R.score++;else R.miss.push(it.f);
 save();meters();
 const g=it.gs&&GS.find(x=>x.id===it.gs);
 document.getElementById("fb").innerHTML=(ok?pill("model","✓ JUSTE",esc(it.m)):
  (skipped?"":pill("wrong","✗ FAUX",esc(shown)))+pill("model","✓ MODÈLE",esc(it.m)))+
  `<button class="linkbtn" type="button" id="saym">▶ Écouter la phrase</button>`+
  pill("note","Explication",esc(it.w))+pill("remember","Règle",esc(it.h2))+
  (g?`<button class="btn ghost" id="gsbtn" type="button">Fiche : ${esc(g.title)}</button>`:"");
 document.getElementById("saym").onclick=()=>speak(it.m,false);
 if(g)document.getElementById("gsbtn").onclick=()=>openGS(g.id);
 stage.querySelectorAll(".tile,.opt,.gap,#ans,#hint,#conf").forEach(e=>{e.disabled=true;e.style.pointerEvents="none"});
 ownBonus(document.getElementById("bonusbox"),it);
 const act=stage.querySelector(".act");
 act.innerHTML=`<button class="btn" id="next" type="button">${R.single?"← Retour":R.i<R.items.length-1?"Suivant":"Voir mon score"}</button>`;
 const nx=document.getElementById("next");nx.focus();
 nx.onclick=()=>{R.i++;if(R.single){back();return}if(R.i<R.items.length)show();else end()};
}
function end(again){
 if(!again){S.round++;save()}
 const fams=[...new Set(R.miss)];
 stage.innerHTML=`<div class="prog" aria-hidden="true"><i style="width:100%"></i></div><div class="card"><div class="cardhead"><b>Série terminée</b><span>Série ${S.round}</span></div><div class="cardbody">
 <p class="big">${R.score} / ${R.items.length}</p>
 ${fams.length?fams.map(f=>pill("trap","⚠ "+esc(FAM[f].n),esc(FAM[f].tip))).join(""):pill("model","✓ BRAVO","")}
 <div class="act"><button class="btn" id="again" type="button">Encore une série</button></div></div></div>`;
 document.getElementById("again").onclick=start;
}

function boldify(text,vocab){
 let t=esc(text);const marks=[];
 vocab.slice().sort((a,b)=>b[0].length-a[0].length).forEach(([fr,en])=>{
  const re=new RegExp("(^|[^\\p{L}])("+esc(fr).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?=[^\\p{L}]|$)","gu");

const words=s=>norm(s).replace(/[-–—]/g," ").replace(/[^\p{L}' ]/gu," ").replace(/'/g,"' ").split(/\s+/).filter(Boolean);

 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=fold(a[i])===fold(b[j])?1+L[i+1][j+1]:Math.max(L[i+1][j],L[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(fold(a[i])===fold(b[j])){hit[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}

   const h2=hit(p.text,q)||hit(p.title,q);if(h2)out.push({k:"Écoute",t:`<b>${esc(p.title)}</b><br>${h2}`,f:()=>openListening(p)});
  });
  RD.forEach(d=>{const h5=hit(d.text,q)||hit(d.title,q)||hit(d.words.flat().join(" · "),q);if(h5)out.push({k:"Lire",t:`<b>${esc(d.title)}</b><br>${h5}`,f:()=>go(()=>readView(d))})});
  WR.forEach(w=>{const h6=hit(w.task,q)||hit(w.title,q)||hit(w.useful.join(" · "),q);if(h6)out.push({k:"Écrire",t:`<b>${esc(w.title)}</b><br>${h6}`,f:()=>go(()=>writeTask(w))})});
  SP.forEach(s=>{const h4=hit(s.fr,q)||hit(s.en,q);if(h4)out.push({k:"Parler",t:h4,f:()=>go(()=>speakView(s))})});
  I.forEach(it=>{const h3=hit(it.m,q)||hit(it.en,q)||hit(it.w,q)||hit(FAM[it.f].n,q);if(h3)out.push({k:"Exercice",t:`${h3} <span class="small">· ${esc(FAM[it.f].n)}</span>`,f:()=>practice(it)})});
 }
 const order=["Grammaire","Vocabulaire","Phrase","Lire","Écrire","Écoute","Parler","Exercice"];
 out.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
 const shown=out.slice(0,40);
 stage.innerHTML=`<div class="card"><div class="cardhead"><b>Recherche</b><span>« ${esc(raw)} » · ${out.length}</span></div><div class="cardbody">
 ${q.length<2?`<p class="small">Deux lettres au moins.</p>`:out.length?`<div class="res">${shown.map((r,k)=>`<button type="button" data-r="${k}"><span class="tag">${r.k}</span> ${r.t}</button>`).join("")}</div>`:`<p class="small">Rien trouvé.</p>`}
 </div></div>`;
 stage.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>shown[+b.dataset.r].f());
}
document.getElementById("sform").onsubmit=e=>{e.preventDefault();const v=document.getElementById("sq").value;go(()=>searchView(v))};
document.getElementById("back").onclick=back;
document.getElementById("homebtn").onclick=()=>{try{stopAudio();REC.on&&REC.stop()}catch(e){}home();try{window.scrollTo(0,0)}catch(e){}};
document.getElementById("sheetsbtn").onclick=()=>go(sheetsList);

function meters(){
 const rows=Object.keys(FAM).map(f=>[f,mastery(f)]).sort((a,b)=>a[1].pct-b[1].pct);
 const ld=Object.keys(S.listen).length,sp=Object.keys(S.speak).length;
 const bar=(lab,n,tot)=>`<div class="meter"><span>${lab}</span><span>${n}/${tot}</span><div class="bar"><i style="width:${Math.max(4,100*n/tot)}%;background:var(--blue)"></i></div></div>`;
 document.getElementById("meters").innerHTML=bar("Écouter",ld,LP.length)+bar("Lire",Object.keys(S.read).length,RD.length)+bar("Écrire",Object.keys(S.write).length,WR.length)+bar("Parler",sp,SP.length)+rows.map(([f,m])=>{
  const col=m.seen===0?"var(--line)":m.pct<50?"var(--red)":m.pct<75?"var(--amber)":"var(--green)";
  return `<div class="meter" title="${esc(FAM[f].tip)}"><span>${esc(FAM[f].n)}</span><span>${m.seen?m.pct+"%":"–"}</span><div class="bar"><i style="width:${m.seen?m.pct:4}%;background:${col}"></i></div></div>`}).join("");
}
document.getElementById("reset").onclick=e=>{
 const b=e.currentTarget;
 if(b.dataset.sure){S={fam:{},item:{},round:0,listen:{},speak:{},bonus:0,read:{},write:{},num:{ok:0,n:0}};save();meters();home();b.textContent="Tout recommencer";delete b.dataset.sure}
 else{b.dataset.sure="1";b.textContent="Appuie encore pour tout effacer"}
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName)&&document.activeElement.id!=="ans")){const n=document.getElementById("next");if(n&&document.activeElement!==n){e.preventDefault();n.click()}}});
meters();home();
}

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
