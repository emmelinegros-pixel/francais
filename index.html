<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Français au quotidien</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4f8c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: calm, encouraging, precise
   IDEA a lagoon-side workbook: one exercise card at a time, the teacher's colour code on every answer
   PICTURE the live exercise card itself, large, with tiles to drag and blanks to fill
   COLOUR lagoon teal ground band, white page; teacher code: navy exercise, red WRONG, green MODEL, blue remember, grey note, amber trap
   TYPE Lexend 700 + Lexend 400
   LAYOUT laptop: card left, weak-spot meters right; phone: title, card, meters */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1a1c);--ink:light-dark(#14222a,#e8f1f2);--soft:light-dark(#5b6b72,#9fb2b7);--line:light-dark(#d9e3e6,#2a3a3e);--panel:light-dark(#f4f8f9,#16252a);--lagoon:light-dark(#0a7c86,#0d5d65);--lagoonhi:light-dark(#d8f1f3,#103a3f);--navy:light-dark(#16295a,#22397a);--red:light-dark(#c93a3a,#ff7b7b);--redbg:light-dark(#fdeeee,#3a1c1f);--green:light-dark(#21804a,#5fd38f);--greenbg:light-dark(#e8f6ee,#163126);--blue:light-dark(#1f63c6,#7fb0ff);--bluebg:light-dark(#eaf1fc,#17253f);--grey:light-dark(#5b6b72,#a6b6bb);--greybg:light-dark(#f1f3f4,#1d2a2e);--amber:light-dark(#a86a00,#ffc457);--amberbg:light-dark(#fff5e0,#3a2d12)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,44px) max(5vw,16px)}
.top{background:var(--lagoon);color:#fff}
.top h1{font-size:clamp(32px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.top p{margin:0;max-width:60ch;opacity:.92}
.wrap{max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.cardhead{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.cardhead b{font-weight:500}
.cardbody{padding:clamp(16px,2.6vw,28px)}
.q{font-size:clamp(19px,2.4vw,23px);line-height:1.45;margin:4px 0 18px;font-weight:500}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--navy);text-align:center;padding:0 6px;margin:0 2px;color:var(--navy);cursor:pointer;min-height:1.3em;vertical-align:baseline}
:root[data-theme=dark] .gap,.gap{border-color:light-dark(#16295a,#8fa8ff);color:light-dark(#16295a,#c5d3ff)}
.gap.sel{background:var(--lagoonhi)}
.gap.over{background:var(--lagoonhi);outline:2px dashed var(--lagoon)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;color:inherit;cursor:pointer}
.opt{min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;font-size:17px}
.opt:hover{border-color:var(--lagoon)}
.opt.on{border-color:var(--navy);background:var(--lagoonhi)}
.opt.good{border-color:var(--green);background:var(--greenbg)}
.opt.bad{border-color:var(--red);background:var(--redbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;min-height:48px}
.tile{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--navy);background:var(--bg);font-size:17px;touch-action:none;user-select:none}
.tile.used{opacity:.25;pointer-events:none}
.line{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.line .tile{background:var(--lagoonhi)}
input[type=text]{font:inherit;font-size:18px;width:100%;max-width:420px;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input[type=text]:focus,button:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.hint{color:var(--soft);font-size:14px;margin:6px 0 0}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{min-height:48px;padding:10px 22px;border-radius:10px;border:0;background:var(--lagoon);color:#fff;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:18px;display:grid;gap:8px}
.pill{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px;padding:10px 14px;border-radius:10px;align-items:baseline}
.pill b{font-size:13px;font-weight:700;white-space:nowrap}
.wrong{background:var(--redbg)}.wrong b{color:var(--red)}
.model{background:var(--greenbg)}.model b{color:var(--green)}
.note{background:var(--greybg)}.note b{color:var(--grey)}
.remember{background:var(--bluebg)}.remember b{color:var(--blue)}
.trap{background:var(--amberbg)}.trap b{color:var(--amber)}
.idiom{background:light-dark(#f1ebfb,#2c2340)}
.idiom b{color:light-dark(#5b3a9b,#cdb6ff)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--lagoon);transition:width .3s}
.side h2{font-size:20px;margin:0 0 4px}
.side p{margin:0 0 12px;color:var(--soft);font-size:14px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;margin-bottom:10px;font-size:14px}
.meter .bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.years{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.yr{min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.yr.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{font-size:clamp(40px,7vw,64px);font-weight:700;line-height:1;margin:6px 0}
.small{font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--lagoonhi);color:var(--ink)}
textarea{font:inherit;font-size:17px;width:100%;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);resize:vertical}
textarea:focus{outline:3px solid var(--lagoon);outline-offset:2px}
.bonus{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.bonus .en{font-size:18px;font-weight:500;margin:4px 0 10px}
.qblock{margin:18px 0 6px}
.qblock .q{font-size:18px;margin:0 0 10px}
.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 6px}
.transcript{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;line-height:1.7}
.btn[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.topnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 auto 18px;max-width:1240px}
.topnav form{display:flex;gap:8px;flex:1 1 300px}
.topnav input[type=search]{font:inherit;font-size:16px;flex:1;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.linkbtn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--blue);text-decoration:underline;font-size:15px}
b.hl{font-weight:700;color:var(--navy);border-bottom:2px dotted var(--blue);cursor:pointer}
:root[data-theme=dark] b.hl{color:light-dark(#16295a,#c5d3ff)}
.gloss{color:var(--blue);font-size:15px;font-weight:400}
.sheet table{width:100%;border-collapse:collapse;font-size:16px}
.sheet td,.sheet th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sheet th{font-size:13px;color:var(--soft);font-weight:500}
.sheet td:first-child{font-weight:500}
.hidefr .fr{filter:blur(6px);cursor:pointer}
.learn{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.learn li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.learn .en{font-size:18px;font-weight:500;margin:0}
.learn .fr{margin:0;color:var(--soft)}
.learn button{grid-row:1/span 2;grid-column:2}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:10px}
.cards button{text-align:left;min-height:84px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
.cards button:hover{border-color:var(--lagoon)}
.res{display:grid;gap:8px}
.res button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:48px}
.res mark{background:var(--amberbg);color:inherit;padding:0 2px}
@media(max-width:600px){.sheet td,.sheet th{padding:8px 4px}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
.top{background:#1d4f8c}
:root{--lagoon:light-dark(#1d5fa8,#2a64a8);--lagoonhi:light-dark(#dde9f8,#14304f)}
.homeact{margin-top:0}.homeact .btn{flex:1 1 12em;min-height:64px;font-size:18px}
.ln{margin:0 0 6px}.spk{color:var(--soft)}
.frbig{font-size:18px;font-weight:500;margin:0}.ensmall{margin:0;color:var(--soft)}
.hidefr .hid{filter:blur(6px);cursor:pointer}
.okw{color:var(--green);font-weight:500}.badw{color:var(--red);font-weight:700;text-decoration:underline wavy}
#mic[aria-pressed=true]{background:var(--red)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px}
.parts div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.doc{white-space:pre-line;background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:16px 18px;font-size:17px;line-height:1.6;margin:0 0 8px}
.nq{padding-left:1.4em;display:grid;gap:10px;margin:16px 0}.nq li{display:grid;gap:4px}.nq input{max-width:12em;min-height:44px}.nres{font-size:15px}
.aud{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;margin-bottom:10px}.aud audio{width:100%}
.chk{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.chk input{width:22px;height:22px;flex:none;margin-top:2px}
a.lnk{display:block;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none}a.lnk b{color:var(--blue)}
</style>
</head>
<body>
<header class="band top"><div class="wrap">
<h1>Français au quotidien</h1>
</div></header>
<main class="band"><nav class="topnav" aria-label="Navigation"><button class="btn ghost" id="back" type="button">← Retour</button><button class="btn ghost" id="homebtn" type="button">Accueil</button><form id="sform" role="search"><label for="sq" class="small" hidden>Chercher</label><input type="search" id="sq" placeholder="Chercher un mot (français ou anglais)" autocomplete="off"><button class="btn" type="submit">Chercher</button></form><button class="btn ghost" id="sheetsbtn" type="button">Fiches</button></nav><div class="wrap grid">
<section id="stage" aria-live="polite"></section>
<aside class="side"><div class="panel">
<h2>Mes points faibles</h2>
<div id="meters"></div>
<button class="btn ghost" id="reset" type="button">Tout recommencer</button>
</div></aside>
</div></main>
<script>
{
const D={"FAM": {"genre": {"n": "Le, la, un, une", "tip": "Learn each noun with its article: la maison, le pain. -tion, -té, -ure are often feminine; -ment, -age, -eau often masculine."}, "part": {"n": "Du, de la, des, de", "tip": "Some bread = du pain. After a negative or a quantity: de (pas de pain, un kilo de tomates)."}, "pc": {"n": "Passé composé : avoir ou être", "tip": "Most verbs: avoir (j'ai mangé). Movement verbs and verbs with se: être (je suis allé, je me suis levé)."}, "imp": {"n": "Imparfait ou passé composé", "tip": "Imparfait = background, habit, description (il pleuvait). Passé composé = one finished event (il est arrivé)."}, "fut": {"n": "Le futur", "tip": "Futur proche: aller + infinitive (je vais appeler). After quand and si + present, French uses the future."}, "pron": {"n": "Le, lui, y, en", "tip": "le / la / les = the thing or person. lui / leur = to him, to them. y = there. en = some, of it."}, "neg": {"n": "La négation", "tip": "ne + verb + pas / plus / jamais / rien / personne. Passé composé: around avoir or être (je n'ai pas mangé)."}, "quest": {"n": "Poser une question", "tip": "Est-ce que + normal order. Où, quand, combien + est-ce que. quel / quelle agrees with the noun."}, "prep": {"n": "À, au, en, chez", "tip": "à + city, en + feminine country, au + masculine country, chez + person, en + bus or car."}, "poli": {"n": "Politesse", "tip": "vous with strangers. Je voudrais, pourriez-vous… s'il vous plaît. Not « je veux » at a counter."}, "verb": {"n": "Verbes du quotidien", "tip": "faire, prendre, devoir, vouloir are irregular: learn je, tu, il, nous, vous, ils by heart."}, "faux": {"n": "Faux amis", "tip": "Words that look English but mean something else: librairie = bookshop, actuellement = currently, rester = to stay."}, "accord": {"n": "Les accords", "tip": "Adjectives agree with the noun: une voiture neuve, des pommes chères. With être, the participle agrees: elle est partie."}, "subj": {"n": "Il faut que…", "tip": "After il faut que and je veux que: subjonctif (que je fasse, que j'aille, que vous soyez)."}}, "I": [{"id": "g1", "f": "genre", "t": "mc", "q": "Je voudrais ___ baguette, s'il vous plaît.", "m": "Je voudrais une baguette, s'il vous plaît.", "w": "baguette is feminine: une. You want one baguette, any one: une, not la.", "h2": "Learn every noun with its article: une baguette, un croissant, le pain.", "hq": "baguette: masculine or feminine? Do you want one baguette, or a specific one?", "nc": "un croissant (masculine) ≠ ___ baguette (feminine).", "en": "I'd like a baguette, please.", "own": "avec « je voudrais un… » ou « je voudrais une… »", "o": ["une", "un", "la", "de"], "a": 0, "gs": "art"}, {"id": "g2", "f": "genre", "t": "type", "q": "Où est ___ gare, s'il vous plaît ?", "m": "Où est la gare, s'il vous plaît ?", "w": "gare is feminine, and there is one station in town: la gare.", "h2": "le / la = the one we both know: la gare, la poste, le marché.", "hq": "gare: masculine or feminine? Any station, or the station of the town?", "nc": "le marché (masculine) ≠ ___ gare (feminine).", "en": "Where is the station, please?", "own": "avec « Où est le… ? » ou « Où est la… ? »", "a": ["la"], "h": "un mot", "gs": "art"}, {"id": "g3", "f": "genre", "t": "mc", "q": "C'est ___ gros problème.", "m": "C'est un gros problème.", "w": "problème ends in -e but is masculine: un problème (like un système, un programme).", "h2": "Nouns in -ème (problème, système, thème) are masculine.", "hq": "Nouns in -ème, like problème and système: masculine or feminine?", "nc": "une crème (feminine) ≠ ___ problème (masculine).", "en": "It's a big problem.", "own": "avec « C'est un… »", "o": ["un", "une", "la", "de"], "a": 0, "gs": "art"}, {"id": "g4", "f": "genre", "t": "drag", "q": "Elle a perdu ___ clé et ___ téléphone.", "m": "Elle a perdu sa clé et son téléphone.", "w": "son / sa agree with the object, not the owner: sa clé (clé is feminine), son téléphone (masculine). Even for a woman: son téléphone.", "h2": "son, sa, ses: the noun after decides, never the owner.", "hq": "Look at the thing, not the person: clé is…? téléphone is…?", "nc": "English his / her: the owner decides ≠ French: the object decides.", "en": "She lost her key and her phone.", "own": "avec « son… » et « sa… »", "b": ["sa", "son", "son", "sa"], "a": ["sa", "son"], "gs": "art"}, {"id": "g5", "f": "genre", "t": "mc", "q": "J'aime beaucoup ___ fromage.", "m": "J'aime beaucoup le fromage.", "w": "After aimer, adorer, préférer, détester: the thing in general → le fromage.", "h2": "aimer, adorer, détester + le, la, les.", "hq": "aimer: cheese in general, or some cheese on your plate?", "nc": "Je mange ___ fromage (some) ≠ J'aime ___ fromage (in general).", "en": "I really like cheese.", "own": "avec « j'aime le… » ou « je déteste la… »", "o": ["le", "du", "un", "de"], "a": 0, "gs": "art"}, {"id": "p1", "f": "part", "t": "mc", "q": "Le matin, je bois ___ café.", "m": "Le matin, je bois du café.", "w": "Some coffee, a quantity: du café.", "h2": "boire, manger, acheter + du, de la, de l'.", "hq": "Do you drink all the coffee in the world, or some coffee?", "nc": "J'aime ___ café (in general) ≠ Je bois ___ café (some).", "en": "In the morning I drink coffee.", "own": "avec « je bois du… » ou « je mange de la… »", "o": ["du", "le", "de", "des"], "a": 0, "gs": "art"}, {"id": "p2", "f": "part", "t": "type", "q": "Il n'y a plus ___ lait.", "m": "Il n'y a plus de lait.", "w": "After a negative (pas, plus, jamais): du, de la, des → de.", "h2": "Il y a du lait → Il n'y a pas de lait.", "hq": "The sentence is negative (n'… plus). What does du become after a negative?", "nc": "Il y a ___ lait (some) ≠ Il n'y a plus ___ lait (none).", "en": "There's no milk left.", "own": "avec « il n'y a plus de… »", "a": ["de", "d'"], "h": "un mot", "gs": "art"}, {"id": "p3", "f": "part", "t": "drag", "q": "Je prends ___ eau et ___ pommes.", "m": "Je prends de l'eau et des pommes.", "w": "eau starts with a vowel: de l'eau. pommes is plural: des pommes.", "h2": "du (masculine) · de la (feminine) · de l' (vowel) · des (plural).", "hq": "eau begins with a vowel: du, de la or de l'? pommes is plural: which one?", "nc": "___ pain (masculine) · ___ salade (feminine) · ___ eau (vowel).", "en": "I'll take some water and some apples.", "own": "avec « de l'… » et « des… »", "b": ["de l'", "des", "du", "de la"], "a": ["de l'", "des"], "gs": "art"}, {"id": "p4", "f": "part", "t": "mc", "q": "Un kilo ___ tomates, s'il vous plaît.", "m": "Un kilo de tomates, s'il vous plaît.", "w": "After a quantity (un kilo, une bouteille, beaucoup, un peu): de, never des.", "h2": "un kilo de, un verre de, beaucoup de, un peu de.", "hq": "un kilo is a quantity. What comes after a quantity?", "nc": "Je voudrais ___ tomates (some) ≠ un kilo ___ tomates (a quantity).", "en": "A kilo of tomatoes, please.", "own": "avec « un kilo de… » ou « une bouteille de… »", "o": ["de", "des", "du", "les"], "a": 0, "gs": "art"}, {"id": "p5", "f": "part", "t": "mc", "q": "Tu veux ___ salade ?", "m": "Tu veux de la salade ?", "w": "salade is feminine, a quantity: de la salade.", "h2": "de la + feminine noun: de la salade, de la soupe.", "hq": "salade: masculine or feminine? Is the question negative?", "nc": "___ pain (masculine) ≠ ___ salade (feminine).", "en": "Do you want some salad?", "own": "avec « tu veux de la… ? »", "o": ["de la", "de le", "de les", "du"], "a": 0, "gs": "art"}, {"id": "c1", "f": "pc", "t": "mc", "q": "Hier, nous ___ au marché.", "m": "Hier, nous sommes allés au marché.", "w": "aller takes être: nous sommes allés. With être, the participle agrees: allés (plural).", "h2": "Movement verbs (aller, venir, partir, arriver…) take être.", "hq": "aller is a movement verb: avoir or être? With être, does allé agree with nous?", "nc": "nous ___ mangé (avoir: no agreement) ≠ nous ___ allés (être: agreement).", "en": "Yesterday we went to the market.", "own": "avec « je suis allé… »", "o": ["sommes allés", "avons allés", "sommes allé", "étions allés"], "a": 0, "gs": "pc"}, {"id": "c2", "f": "pc", "t": "type", "q": "Elle ___ partie à huit heures.", "m": "Elle est partie à huit heures.", "w": "partir takes être: elle est partie (feminine: partie).", "h2": "être + participle: the participle agrees (parti, partie, partis).", "hq": "partir is a movement verb: avoir or être?", "nc": "Elle ___ mangé (avoir) ≠ Elle ___ partie (être).", "en": "She left at eight o'clock.", "own": "avec « je suis parti… »", "a": ["est"], "h": "un mot", "gs": "pc"}, {"id": "c3", "f": "pc", "t": "mc", "q": "Ce matin, je ___ à six heures.", "m": "Ce matin, je me suis levé à six heures.", "w": "Every verb with se (se lever, se laver, se coucher) takes être: je me suis levé.", "h2": "se lever → je me suis levé, se reposer → je me suis reposé.", "hq": "se lever has se: avoir or être in the passé composé? Where does me go?", "nc": "J'___ levé la main (lever, no se: avoir) ≠ Je me ___ levé (se lever: être).", "en": "This morning I got up at six.", "own": "avec « je me suis… »", "o": ["me suis levé", "me suis lever", "me suis levés", "m'ai levé"], "a": 0, "gs": "pc"}, {"id": "c4", "f": "pc", "t": "mc", "q": "Tu ___ le pain ?", "m": "Tu as pris le pain ?", "w": "prendre takes avoir; its participle is irregular: pris.", "h2": "Irregular participles: pris (prendre), fait (faire), vu (voir), eu (avoir), été (être).", "hq": "prendre: avoir or être? And the participle: j'ai p___ ?", "nc": "tu as ___ (prendre) ≠ tu as mis (mettre).", "en": "Did you take the bread?", "own": "avec « j'ai pris… »", "o": ["as pris", "es pris", "as prendu", "as prit"], "a": 0, "gs": "pc"}, {"id": "c5", "f": "pc", "t": "order", "q": "", "m": "Nous avons fait les courses samedi.", "w": "avoir comes before the participle: nous avons fait.", "h2": "Passé composé = avoir / être + participle.", "hq": "Where does avons go: before or after fait?", "nc": "Nous faisons les courses (present) ≠ Nous avons ___ les courses (passé composé).", "en": "We did the shopping on Saturday.", "own": "avec « nous avons fait… »", "a": "Nous avons fait les courses samedi.", "gs": "pc"}, {"id": "c6", "f": "pc", "t": "mc", "q": "Ils ___ chez nous dimanche.", "m": "Ils sont venus chez nous dimanche.", "w": "venir takes être; plural subject: venus.", "h2": "venir, revenir, devenir take être.", "hq": "venir: avoir or être? Does venu agree with ils?", "nc": "Ils ___ mangé chez nous (avoir) ≠ Ils ___ venus chez nous (être).", "en": "They came to our place on Sunday.", "own": "avec « il est venu… »", "o": ["sont venus", "sont venu", "sont venues", "ont venus"], "a": 0, "gs": "pc"}, {"id": "i1", "f": "imp", "t": "mc", "q": "Quand j'étais petit, nous ___ à la plage tous les jours.", "m": "Quand j'étais petit, nous allions à la plage tous les jours.", "w": "tous les jours in the past = a habit: imparfait (nous allions).", "h2": "Habit in the past (tous les jours, souvent, avant): imparfait.", "hq": "Is it one trip to the beach, or something you did every day?", "nc": "Hier, nous ___ à la plage (one time) ≠ tous les jours, nous ___ à la plage (habit).", "en": "When I was little, we went to the beach every day.", "own": "avec « quand j'étais petit, je… »", "o": ["allions", "sommes allés", "allons", "irons"], "a": 0, "gs": "pc"}, {"id": "i2", "f": "imp", "t": "drag", "q": "Il ___ quand je ___ de la maison.", "m": "Il pleuvait quand je suis sorti de la maison.", "w": "The rain is the background: imparfait. Going out is the event: passé composé.", "h2": "Background = imparfait. Event = passé composé.", "hq": "Which one is the situation around, and which one is the event that happens?", "nc": "the situation: il ___ ≠ the event: je ___ .", "en": "It was raining when I left the house.", "own": "avec « il faisait… quand je suis… »", "b": ["pleuvait", "suis sorti", "a plu", "sortais"], "a": ["pleuvait", "suis sorti"], "gs": "pc"}, {"id": "i3", "f": "imp", "t": "mc", "q": "Hier, j'___ un appel de la banque.", "m": "Hier, j'ai reçu un appel de la banque.", "w": "One call, at one moment yesterday: passé composé.", "h2": "One finished event with a date (hier, lundi): passé composé.", "hq": "One call at one moment, or something that happened every day?", "nc": "Avant, je recevais souvent des appels (habit) ≠ Hier, j'___ un appel (one event).", "en": "Yesterday I got a call from the bank.", "own": "avec « hier, j'ai… »", "o": ["ai reçu", "recevais", "reçois", "avais reçu"], "a": 0, "gs": "pc"}, {"id": "i4", "f": "imp", "t": "type", "q": "La maison ___ grande et il y avait un jardin.", "m": "La maison était grande et il y avait un jardin.", "w": "Description in the past: imparfait (était, avait).", "h2": "What it was like in the past: imparfait.", "hq": "Is this a description (what the house was like) or an event?", "nc": "La maison ___ grande (description) ≠ Ils ont vendu la maison (event).", "en": "The house was big and there was a garden.", "own": "avec « c'était… »", "a": ["était"], "h": "être", "gs": "pc"}, {"id": "i5", "f": "imp", "t": "mc", "q": "Je ___ la télé quand tu as téléphoné.", "m": "Je regardais la télé quand tu as téléphoné.", "w": "I was watching (in progress) when you called (event): imparfait + passé composé.", "h2": "was + -ing in English → imparfait in French.", "hq": "In English: I was watching. Was it in progress, or finished?", "nc": "J'___ la télé hier soir (finished) ≠ Je ___ la télé quand… (in progress).", "en": "I was watching TV when you called.", "own": "avec « je… quand tu as… »", "o": ["regardais", "ai regardé", "regarde", "regarderai"], "a": 0, "gs": "pc"}, {"id": "f1", "f": "fut", "t": "mc", "q": "Demain, je ___ le plombier.", "m": "Demain, je vais appeler le plombier.", "w": "Futur proche: aller (je vais) + infinitive (appeler).", "h2": "je vais, tu vas, il va, nous allons, vous allez, ils vont + infinitive.", "hq": "Futur proche: aller + which form of the verb? And aller with je is…?", "nc": "je vais ___ (infinitive) ≠ j'appelle (present).", "en": "Tomorrow I'm going to call the plumber.", "own": "avec « demain, je vais… »", "o": ["vais appeler", "vais appelle", "va appeler", "vais appelé"], "a": 0}, {"id": "f2", "f": "fut", "t": "type", "q": "Ce soir, nous ___ manger au restaurant.", "m": "Ce soir, nous allons manger au restaurant.", "w": "aller with nous: allons. Then the infinitive: manger.", "h2": "Futur proche: aller + infinitive.", "hq": "aller with nous: what form?", "nc": "nous ___ (aller) ≠ vous allez (aller).", "en": "Tonight we're going to eat at a restaurant.", "own": "avec « ce soir, nous allons… »", "a": ["allons"], "h": "aller"}, {"id": "f3", "f": "fut", "t": "mc", "q": "Quand tu ___ à Toulon, appelle-moi.", "m": "Quand tu seras à Toulon, appelle-moi.", "w": "After quand about the future, French uses the future: quand tu seras. English uses the present.", "h2": "quand + future: Quand je serai prêt, je t'appellerai.", "hq": "English says 'when you are'. Is it now or later? Which tense does French use after quand, then?", "nc": "When you are in Toulon (English: present) ≠ Quand tu ___ à Toulon (French: future).", "en": "When you're in Toulon, call me.", "own": "avec « quand je serai… »", "o": ["seras", "es", "étais", "serais"], "a": 0}, {"id": "f4", "f": "fut", "t": "mc", "q": "S'il pleut demain, nous ___ à la maison.", "m": "S'il pleut demain, nous resterons à la maison.", "w": "si + present, then the future: s'il pleut, nous resterons.", "h2": "si + present → future. Never the conditional after si + present.", "hq": "si + present (il pleut): what comes after? Future or conditional?", "nc": "S'il pleut, nous ___ (future) ≠ S'il pleuvait, nous resterions (conditional).", "en": "If it rains tomorrow, we'll stay home.", "own": "avec « s'il fait beau, nous… »", "o": ["resterons", "resterions", "restions", "sommes restés"], "a": 0}, {"id": "f5", "f": "fut", "t": "order", "q": "", "m": "Je vais prendre le bus demain matin.", "w": "aller + infinitive, then when: je vais prendre… demain matin.", "h2": "Futur proche: aller + infinitive.", "hq": "Which word comes right after je? And after vais?", "nc": "Je prends le bus (now) ≠ Je vais ___ le bus (future).", "en": "I'm going to take the bus tomorrow morning.", "own": "avec « je vais prendre… »", "a": "Je vais prendre le bus demain matin."}, {"id": "n1", "f": "pron", "t": "mc", "q": "Tu as vu Paul ? — Oui, je ___ ai vu hier.", "m": "Oui, je l'ai vu hier.", "w": "voir Paul (no à): direct → le, and le becomes l' before ai.", "h2": "voir, aider, appeler, attendre + le / la / les.", "hq": "voir Paul: is there à before Paul? Then which pronoun? And before a vowel?", "nc": "Je ___ téléphone (téléphoner à Paul) ≠ Je l'ai vu (voir Paul).", "en": "Yes, I saw him yesterday.", "own": "avec « je l'ai vu »", "o": ["l'", "lui", "le", "y"], "a": 0, "gs": "pron"}, {"id": "n2", "f": "pron", "t": "mc", "q": "Tu téléphones à ta mère ? — Oui, je ___ téléphone tous les soirs.", "m": "Oui, je lui téléphone tous les soirs.", "w": "téléphoner à quelqu'un: lui (= to her). Same with parler à, écrire à, donner à.", "h2": "téléphoner à, parler à, écrire à + lui / leur.", "hq": "téléphoner à ta mère: there is à. One person or several?", "nc": "Je la vois (voir ta mère) ≠ Je ___ téléphone (téléphoner à ta mère).", "en": "Yes, I call her every evening.", "own": "avec « je lui téléphone »", "o": ["lui", "la", "leur", "l'"], "a": 0, "gs": "pron"}, {"id": "n3", "f": "pron", "t": "type", "q": "Tu vas à la poste ? — Oui, j'___ vais cet après-midi.", "m": "Oui, j'y vais cet après-midi.", "w": "y replaces à + a place (à la poste): j'y vais.", "h2": "y = there: Tu vas au marché ? J'y vais.", "hq": "à la poste is a place. Which little word replaces à + a place?", "nc": "J'___ vais (to the post office) ≠ J'en veux (some).", "en": "Yes, I'm going there this afternoon.", "own": "avec « j'y vais »", "a": ["y"], "h": "un mot", "gs": "pron"}, {"id": "n4", "f": "pron", "t": "mc", "q": "Tu veux du café ? — Oui, j'___ veux bien.", "m": "Oui, j'en veux bien.", "w": "en replaces du, de la, des + noun: j'en veux.", "h2": "en = some, of it: Tu as des enfants ? J'en ai deux.", "hq": "du café = some coffee. Which pronoun replaces 'some + noun'?", "nc": "Tu veux le café ? — Je le veux (that coffee) ≠ du café → j'___ veux (some).", "en": "Yes, I'd like some.", "own": "avec « j'en veux »", "o": ["en", "le", "y", "lui"], "a": 0, "gs": "pron"}, {"id": "n5", "f": "pron", "t": "drag", "q": "Les clés ? Je ___ ai posées sur la table. Et ton frère ? Je ___ ai donné un double.", "m": "Les clés ? Je les ai posées sur la table. Et ton frère ? Je lui ai donné un double.", "w": "poser les clés (no à): les. donner à ton frère (à): lui.", "h2": "No à → le / la / les. With à + person → lui / leur.", "hq": "poser les clés: is there à? donner à ton frère: is there à?", "nc": "Je les ai posées (the keys) ≠ Je ___ ai donné (to your brother).", "en": "The keys? I put them on the table. Your brother? I gave him a spare.", "own": "avec « je les ai… » ou « je lui ai… »", "b": ["les", "lui", "leur", "le"], "a": ["les", "lui"], "gs": "pron"}, {"id": "e1", "f": "neg", "t": "mc", "q": "Je ___ comprends pas.", "m": "Je ne comprends pas.", "w": "ne … pas goes around the verb: je ne comprends pas.", "h2": "ne + verb + pas. n' only before a vowel (je n'aime pas).", "hq": "Two words go around comprends. Which one goes before? Does comprends start with a vowel?", "nc": "Je n'aime pas (vowel after) ≠ Je ___ comprends pas (consonant after).", "en": "I don't understand.", "own": "avec « je ne… pas »", "o": ["ne", "n'", "pas", "non"], "a": 0}, {"id": "e2", "f": "neg", "t": "order", "q": "", "m": "Je n'ai pas mangé ce matin.", "w": "In the passé composé, ne … pas goes around avoir: je n'ai pas mangé.", "h2": "Passé composé: ne … pas around avoir / être.", "hq": "Where do n' and pas go: around ai, or around mangé?", "nc": "Je ne mange pas (present) ≠ Je n'ai pas ___ (passé composé).", "en": "I didn't eat this morning.", "own": "avec « je n'ai pas… »", "a": "Je n'ai pas mangé ce matin."}, {"id": "e3", "f": "neg", "t": "mc", "q" 0}, {"id": "q2", "f": "quest", "t": "order", "q": "", "m": "Est-ce que vous avez des enfants ?", "w": "Est-ce que + normal order (vous avez).", "h2": "Est-ce que turns any sentence into a yes / no question.", "hq": "What comes first? Then: subject before or after the verb?", "nc": "Vous avez des enfants. (statement) ≠ Est-ce que vous ___ des enfants ? (question).", "en": "Do you have children?", "own": "avec « est-ce que vous… ? »", "a": "Est-ce que vous avez des enfants ?"}, {"id": "q3", "f": "quest", "t": "mc", "q": "___ coûte ce pain ?", "m": "Combien coûte ce pain ?", "w": "how much = combien.", "h2": "Combien ça coûte ? Ça fait combien ?", "hq": "You want a price. Which question word asks 'how much'?", "nc": "Comment ça va ? (how) ≠ ___ ça coûte ? (how much).", "en": "How much is this bread?", "own": "avec « combien… ? »", "o": ["Combien", "Comment", "Quel prix", "Pourquoi"], "a": 0}, {"id": "q4", "f": "quest", "t": "mc", "q": "___ est-ce que tu fais ce week-end ?", "m": "Qu'est-ce que tu fais ce week-end ?", "w": "what = qu'est-ce que. que becomes qu' before est-ce.", "h2": "Qu'est-ce que tu fais ? Qu'est-ce que c'est ?", "hq": "que + est-ce: what happens to que before a vowel?", "nc": "Tu fais quoi ? (spoken, at the end) ≠ ___ est-ce que tu fais ? (at the start).", "en": "What are you doing this weekend?", "own": "avec « qu'est-ce que… ? »", "o": ["Qu'", "Quoi", "Que", "Qui"], "a": 0}, {"id": "q5", "f": "quest", "t": "mc", "q": "À ___ heure part le train ?", "m": "À quelle heure part le train ?", "w": "heure is feminine: quelle heure.", "h2": "quel + masculine (quel jour), quelle + feminine (quelle heure).", "hq": "heure: masculine or feminine? Does quel agree?", "nc": "___ jour ? (jour: masculine) ≠ ___ heure ? (heure: feminine).", "en": "What time does the train leave?", "own": "avec « à quelle heure… ? »", "o": ["quelle", "quel", "quels", "quelles"], "a": 0}, {"id": "r1", "f": "prep", "t": "drag", "q": "J'habite ___ Hyères, ___ France.", "m": "J'habite à H
